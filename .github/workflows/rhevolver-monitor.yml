name: Rhevolver Monitor 24/7

on:
  pull_request:
    paths:
      - 'monitor/**'
      - 'src/app/api/monitor/**'
      - 'scripts/*monitor*'
      - '.github/workflows/rhevolver-monitor.yml'
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhevolver-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify monitor without external state
        run: |
          node scripts/test-monitor.cjs
          npx tsc --noEmit
          npx eslint monitor src/app/api/monitor scripts/test-monitor.cjs scripts/validate-monitor-acquisition.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify dam CSV validation
        run: python scripts/test-monitor-dam.py
      - name: Install acquisition browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Acquire official SEG, IEPC and dynamic federal publications
        run: xvfb-run --auto-servernum python scripts/discover-monitor.py
      - name: Validate official publication acquisition
        run: node scripts/validate-monitor-acquisition.cjs
      - name: Acquire fresh official Valerio Trujano observation
        if: always()
        run: python scripts/acquire-monitor-dam.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-acquisition-${{ github.run_id }}
          path: |
            work/acquisition-report.json
            work/dam-acquisition-report.json
          retention-days: 3
      - name: Exercise configured preview only
        if: github.event_name != 'pull_request'
        env:
          RHEVOLVER_MONITOR_PREVIEW_URL: ${{ vars.RHEVOLVER_MONITOR_PREVIEW_URL }}
          RHEVOLVER_MONITOR_SECRET: ${{ secrets.RHEVOLVER_MONITOR_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: python scripts/trigger-monitor-preview.py
