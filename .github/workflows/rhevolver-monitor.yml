name: Rhevolver Monitor 24/7

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhevolver-monitor-24-7
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover official SEG publications
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rhevolver
          for cat in 2 7 16; do
            curl --fail --silent --show-error --retry 2 --max-time 25 \
              -A "RhevolverMonitor/1.0" "https://www.seg.gob.mx/?cat=$cat" || true
          done | grep -Eo 'https?://(www\.)?seg\.gob\.mx/[^"<> ]+' | \
            sed 's/&amp;/\&/g' | sort -u | head -n 100 > /tmp/rhevolver/seg-urls.txt
          echo "SEG official URLs discovered: $(wc -l < /tmp/rhevolver/seg-urls.txt)"
          python - <<'PY'
          import json
          urls=[x.strip() for x in open("/tmp/rhevolver/seg-urls.txt",encoding="utf-8") if x.strip()]
          items=[{"id":"seg:"+u,"url":u,"source":"seg","official":True} for u in urls]
          with open("/tmp/rhevolver/seg-items.json","w",encoding="utf-8") as f:
              json.dump({"items":items},f,separators=(",",":"))
          PY

      - name: Deduplicate official SEG publications
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/rhevolver/seg-urls.txt ]; then
            curl --fail --silent --show-error --retry 3 --max-time 60 \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/rhevolver/seg-items.json \
              "https://rhevolver.news/api/monitor/run"
          else
            echo "SEG returned no official URLs; continuing with remaining sources."
          fi

      - name: Trigger Rhevolver source sweep
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 90 \
            "https://rhevolver.news/api/monitor/sweep"
