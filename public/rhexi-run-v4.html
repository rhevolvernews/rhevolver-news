<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>RHEXI RUN v4</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#56c9ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 6px #0009}.top{display:flex;justify-content:space-between;gap:8px;padding:max(12px,env(safe-area-inset-top)) 12px}.pill{background:#14294ee6;border:3px solid #ffffff88;border-radius:18px;padding:8px 12px;font-weight:1000;font-size:18px}.brand{position:fixed;right:14px;bottom:max(18px,env(safe-area-inset-bottom));font-weight:1000;text-align:right}.brand b{color:#ff2d92}.hint{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#252940dc;border:2px solid #fff8;border-radius:20px;padding:9px 18px;font-weight:900;white-space:nowrap}.toast{position:fixed;left:50%;top:27%;transform:translate(-50%,-50%) scale(.85);opacity:0;background:#ff2d92e8;border:3px solid #fff;border-radius:20px;padding:12px 17px;font-weight:1000;transition:.15s}.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}.start{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:linear-gradient(#06163266,#06163299)}.card{width:min(88vw,410px);padding:24px;text-align:center;color:#fff;background:#10182ef2;border:3px solid #ffffff99;border-radius:28px;box-shadow:0 22px 60px #0007}.card h1{margin:0;font-size:38px;line-height:.92}.card h1 span{color:#ff2d92}.card .sub{color:#ffe100;font-weight:900}.card button{border:0;border-radius:18px;padding:14px 28px;font:inherit;font-size:21px;font-weight:1000;color:#fff;background:#ff2d92;box-shadow:0 7px 0 #9c135b}.small{font-size:13px;opacity:.78}.hidden{display:none}.danger{animation:danger .25s}@keyframes danger{50%{filter:brightness(1.5) saturate(1.5)}}@media(max-width:430px){.pill{font-size:15px;padding:7px 9px}.hint{font-size:13px}.brand{font-size:12px}}</style></head><body><div id="start" class="start"><div class="card"><h1>RHEXI <span>RUN</span></h1><p class="sub">IGUALA · PRUEBA 3D JUGABLE</p><p>Corre, cambia de carril, salta baches y esquiva puestos y vehículos.</p><button id="play">JUGAR</button><p class="small">Desliza ← → · arriba salta · abajo se agacha</p></div></div><div class="hud"><div class="top"><div class="pill">🟡 <span id="coins">0</span></div><div class="pill">SCORE <span id="score">000000</span> ×<span id="mult">1</span></div><div class="pill">❤️ <span id="lives">3</span></div></div><div id="toast" class="toast"></div><div class="hint">← DESLIZA · ↑ SALTA · ↓ ESQUIVA →</div><div class="brand">RHEVOLVER <b>NEWS</b><br>IGUALA SIEMPRE CORRE</div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x59caff);scene.fog=new THREE.Fog(0x59caff,42,150);const camera=new THREE.PerspectiveCamera(61,innerWidth/innerHeight,.1,220);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.16;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xeafaff,0x5b7d39,2.5));const sun=new THREE.DirectionalLight(0xfff0cf,3.4);sun.position.set(-12,24,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-24;sun.shadow.camera.right=24;sun.shadow.camera.top=24;sun.shadow.camera.bottom=-24;scene.add(sun);const mat=(c,r=.72,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const mkBox=(x,y,z,c)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(x,y,z),mat(c));m.castShadow=m.receiveShadow=true;return m};const laneX=[-2.9,0,2.9];const world=new THREE.Group();scene.add(world);const road=mkBox(11.8,.24,250,0x3d414c);road.position.set(0,-.12,-112);world.add(road);for(const s of [-1,1]){const curb=mkBox(3.8,.38,250,s<0?0xffc857:0xffa052);curb.position.set(s*7.8,.03,-112);world.add(curb)}for(let z=8;z>-230;z-=10)for(const x of [-1.95,1.95]){const q=mkBox(.1,.03,3.3,0xfafafa);q.position.set(x,.03,z);world.add(q)}const buildingColors=[0xff6e6e,0x45c6ff,0xffd84a,0x67d982,0xb786ff,0xff9147,0x35d2c7];for(let z=5;z>-220;z-=12){for(const side of [-1,1]){const h=4.5+Math.random()*6.5;const b=mkBox(4.7,h,7.5,buildingColors[(Math.random()*buildingColors.length)|0]);b.position.set(side*(10+Math.random()*1.8),h/2,z);world.add(b);const aw=mkBox(4.9,.3,1.4,Math.random()>.5?0xff2f92:0x13c6b2);aw.position.set(b.position.x,1.7,z+3.9);world.add(aw)}}const mountain=new THREE.Mesh(new THREE.ConeGeometry(29,22,7),mat(0x4b9f64,.95));mountain.position.set(-20,8,-132);world.add(mountain);const mountain2=new THREE.Mesh(new THREE.ConeGeometry(24,18,7),mat(0x5bad6f,.95));mountain2.position.set(22,6,-142);world.add(mountain2);function palm(x,z,s=1){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.14,.22,3.8,8),mat(0x9c6336));trunk.position.y=1.9;g.add(trunk);for(let i=0;i<7;i++){const leaf=new THREE.Mesh(new THREE.CapsuleGeometry(.08,1.15,4,6),mat(0x2f9e52,.9));leaf.position.set(Math.cos(i*.9)*.45,4.0,Math.sin(i*.9)*.45);leaf.rotation.z=Math.PI/2;leaf.rotation.y=i*.9;g.add(leaf)}g.position.set(x,0,z);g.scale.setScalar(s);world.add(g)}for(let z=-6;z>-210;z-=18){palm(-8.9,z,.9);palm(8.9,z-7,1)}function arch(z){const g=new THREE.Group();const c=0xf0c89d;const l=mkBox(1.2,6,1.4,c),r=mkBox(1.2,6,1.4,c),top=mkBox(8.8,1.4,1.6,c);l.position.set(-4.1,3,0);r.position.set(4.1,3,0);top.position.set(0,5.5,0);g.add(l,r,top);const sign=document.createElement('canvas');sign.width=512;sign.height=128;const ctx=sign.getContext('2d');ctx.fillStyle='#f0c89d';ctx.fillRect(0,0,512,128);ctx.fillStyle='#23304a';ctx.font='bold 56px serif';ctx.textAlign='center';ctx.fillText('IGUALA',256,62);ctx.font='bold 24px sans-serif';ctx.fillText('DE LA INDEPENDENCIA',256,99);const tex=new THREE.CanvasTexture(sign);const board=new THREE.Mesh(new THREE.PlaneGeometry(6.2,1.35),new THREE.MeshBasicMaterial({map:tex,transparent:true}));board.position.set(0,5.55,0.82);g.add(board);g.position.z=z;world.add(g)}arch(-70);function billboard(x,z,text){const g=new THREE.Group();const p=mkBox(3.1,4.4,.28,0x151b32);p.position.y=3.2;g.add(p);const cv=document.createElement('canvas');cv.width=512;cv.height=768;const c=cv.getContext('2d');c.fillStyle='#17204a';c.fillRect(0,0,512,768);c.fillStyle='#fff';c.font='900 76px sans-serif';c.textAlign='center';c.fillText('RHEVOLVER',256,270);c.fillStyle='#ff2f92';c.fillText('NEWS',256,365);c.fillStyle='#ffe100';c.font='bold 42px sans-serif';c.fillText(text,256,500);const tx=new THREE.CanvasTexture(cv);const m=new THREE.Mesh(new THREE.PlaneGeometry(2.8,4.15),new THREE.MeshBasicMaterial({map:tx}));m.position.set(0,3.2,.16);g.add(m);g.position.set(x,0,z);world.add(g)}for(let z=-15;z>-190;z-=45){billboard(-7.2,z,'CORRE');billboard(7.2,z-20,'IGUALA')}function trafficLight(z,side){const g=new THREE.Group();const pole=mkBox(.16,5,.16,0x292b31);pole.position.y=2.5;g.add(pole);const h=mkBox(.8,2.3,.6,0x1f2024);h.position.set(side*.35,4.6,0);g.add(h);[0xff3548,0xffd326,0x45dd6a].forEach((c,i)=>{const l=new THREE.Mesh(new THREE.SphereGeometry(.19,10,8),new THREE.MeshBasicMaterial({color:c}));l.position.set(side*.35,5.25-i*.68,.34);g.add(l)});g.position.set(side*5.5,0,z);world.add(g)}for(let z=-10;z>-210;z-=38){trafficLight(z,-1);trafficLight(z-12,1)}const rhexi=new THREE.Group();scene.add(rhexi);rhexi.position.set(0,0,2.4);const fur=mat(0xd86d22,.98),earMat=mat(0x91461e,.99),dark=mat(0x08090c,.25),band=mat(0x121214,.9),shoe=mat(0x17181d,.55),sole=mat(0xf4f4f4,.45);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.76,1.15,8,18),fur);torso.position.y=2.05;torso.castShadow=true;rhexi.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.92,22,18),fur);head.scale.set(1,.96,.9);head.position.set(0,3.35,-.05);head.castShadow=true;rhexi.add(head);const ears=[];for(const s of [-1,1]){const e=new THREE.Mesh(new THREE.CapsuleGeometry(.25,.86,7,12),earMat);e.position.set(s*.82,3.3,.06);e.rotation.z=s*.3;rhexi.add(e);ears.push({e,s})}const bandana=new THREE.Mesh(new THREE.ConeGeometry(.8,.9,4),band);bandana.rotation.y=Math.PI/4;bandana.position.set(0,2.65,.35);rhexi.add(bandana);for(let i=0;i<10;i++){const d=new THREE.Mesh(new THREE.SphereGeometry(.03,6,5),mat(0xffffff));d.position.set((i%5-2)*.18,2.67+Math.floor(i/5)*.12,.82);rhexi.add(d)}const limbs=[];for(const s of [-1,1]){const aG=new THREE.Group();const a=new THREE.Mesh(new THREE.CapsuleGeometry(.2,.9,6,10),fur);a.position.y=-.54;aG.add(a);aG.position.set(s*.8,2.45,0);rhexi.add(aG);limbs.push({g:aG,s,type:'arm'});const lG=new THREE.Group();const l=new THREE.Mesh(new THREE.CapsuleGeometry(.25,.86,6,10),fur);l.position.y=-.52;lG.add(l);const sh=new THREE.Mesh(new THREE.SphereGeometry(.34,12,8),shoe);sh.scale.set(.88,.54,1.25);sh.position.set(0,-1.05,-.2);lG.add(sh);const sl=new THREE.Mesh(new THREE.BoxGeometry(.5,.08,.78),sole);sl.position.set(0,-1.25,-.2);lG.add(sl);lG.position.set(s*.42,1.28,0);rhexi.add(lG);limbs.push({g:lG,s,type:'leg'})}const tail=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.5,5,8),earMat);tail.position.set(.58,1.83,.66);tail.rotation.z=-.72;rhexi.add(tail);const shadow=new THREE.Mesh(new THREE.CircleGeometry(.95,24),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.22}));shadow.rotation.x=-Math.PI/2;shadow.position.set(0,.02,2.35);scene.add(shadow);const obstacles=[];function addObject(type,lane,z){let o=new THREE.Group();if(type==='coin'){const c=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.12,20),new THREE.MeshStandardMaterial({color:0xffd51f,emissive:0xff9800,emissiveIntensity:.25,metalness:.6,roughness:.25}));c.rotation.z=Math.PI/2;c.position.y=1.05;o.add(c);o.userData.collect=true}else if(type==='pothole'){const p=new THREE.Mesh(new THREE.CylinderGeometry(.75,1.05,.1,18),mat(0x101217,.95));p.scale.z=1.4;p.position.y=.03;o.add(p)}else if(type==='puddle'){const p=new THREE.Mesh(new THREE.CircleGeometry(1.05,24),new THREE.MeshStandardMaterial({color:0x35c8ff,roughness:.12,metalness:.05,transparent:true,opacity:.82}));p.rotation.x=-Math.PI/2;p.scale.y=.55;p.position.y=.04;o.add(p)}else if(type==='stall'){const base=mkBox(1.7,1.1,1.1,0xe76537);base.position.y=.55;o.add(base);const roof=mkBox(2.3,.2,1.75,0xffd73a);roof.position.y=2.15;o.add(roof);for(const x of [-.78,.78]){const p=mkBox(.07,1.3,.07,0x5a5144);p.position.set(x,1.5,0);o.add(p)}}else if(type==='van'){const v=mkBox(1.85,1.85,3.2,0xe9edf4);v.position.y=.95;o.add(v);const w=mkBox(1.55,.65,.08,0x17254d);w.position.set(0,1.3,1.63);o.add(w);for(const x of [-.65,.65])for(const zz of [-1.1,1.1]){const wh=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.16,12),dark);wh.rotation.z=Math.PI/2;wh.position.set(x,.3,zz);o.add(wh)}}o.position.set(laneX[lane],0,z);o.userData.type=type;o.userData.hit=false;world.add(o);obstacles.push(o)}function seedObjects(){for(let z=-15;z>-205;z-=6.5){const lane=(Math.random()*3)|0;const r=Math.random();if(r<.42)addObject('coin',lane,z);else if(r<.6)addObject('pothole',lane,z);else if(r<.73)addObject('puddle',lane,z);else if(r<.88)addObject('stall',lane,z);else addObject('van',lane,z);if(Math.random()>.5)addObject('coin',(lane+1)%3,z-2.8)}}seedObjects();let playing=false,lane=1,targetX=0,vy=0,jumping=false,sliding=0,score=0,coins=0,lives=3,mult=1,speed=.22,t=0,invuln=0;const $=id=>document.getElementById(id);function toast(x){$('toast').textContent=x;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),650)}function move(d){if(!playing)return;lane=Math.max(0,Math.min(2,lane+d));targetX=laneX[lane]}function jump(){if(playing&&!jumping){jumping=true;vy=.19}}function slide(){if(playing&&!jumping)sliding=34}let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>26)move(dx>0?1:-1);else if(Math.abs(dy)>26)(dy<0?jump():slide())},{passive:true});addEventListener('keydown',e=>{if(['ArrowLeft','a'].includes(e.key))move(-1);if(['ArrowRight','d'].includes(e.key))move(1);if(['ArrowUp','w',' '].includes(e.key))jump();if(['ArrowDown','s'].includes(e.key))slide()});function reset(){lane=1;targetX=0;vy=0;jumping=false;sliding=0;score=0;coins=0;lives=3;mult=1;speed=.22;invuln=0;rhexi.position.set(0,0,2.4);$('coins').textContent=0;$('score').textContent='000000';$('lives').textContent=3;$('mult').textContent=1;obstacles.forEach((o,i)=>{o.position.z=-15-i*3.15;o.visible=true;o.userData.hit=false})}document.getElementById('play').onclick=()=>{if(!playing&&lives<=0)reset();playing=true;$('start').classList.add('hidden')};function hit(type){if(invuln>0)return;if(type==='puddle'){speed=Math.max(.15,speed*.66);toast('💦 ¡CHARCO!');return}lives--;invuln=70;$('lives').textContent=lives;renderer.domElement.classList.add('danger');setTimeout(()=>renderer.domElement.classList.remove('danger'),250);toast(type==='pothole'?'🕳️ ¡BACHE!':type==='stall'?'🛒 ¡PUESTO!':'🚐 ¡VEHÍCULO!');if(lives<=0){playing=false;$('start').classList.remove('hidden');document.getElementById('play').textContent='REINTENTAR'}}function collide(){for(const o of obstacles){if(o.userData.hit||!o.visible)continue;if(Math.abs(o.position.z-rhexi.position.z)<1.05&&Math.abs(o.position.x-rhexi.position.x)<.95){const ty=o.userData.type;if(ty==='coin'){o.userData.hit=true;o.visible=false;coins++;score+=120*mult;$('coins').textContent=coins;if(coins%12===0&&mult<5){mult++;$('mult').textContent=mult;toast('⚡ MULTIPLICADOR ×'+mult)}continue}if(ty==='pothole'&&rhexi.position.y>.72)continue;if(ty==='stall'&&sliding>8)continue;o.userData.hit=true;hit(ty)}}}function animate(){requestAnimationFrame(animate);t+=1/60;if(playing){speed+=(Math.min(.42,.22+score/150000)-speed)*.01;score+=speed*5*mult;$('score').textContent=String(Math.floor(score)).padStart(6,'0');if(invuln>0)invuln--;const dx=targetX-rhexi.position.x;rhexi.position.x+=dx*.19;shadow.position.x=rhexi.position.x;const run=t*(13.5+speed*8);limbs.forEach(l=>{const dir=l.s*(l.type==='leg'?1:-1);l.g.rotation.x=Math.sin(run)*.92*dir});torso.position.y=2.05+Math.abs(Math.sin(run))*.08;head.position.y=3.35+Math.abs(Math.sin(run))*.045;head.rotation.z=Math.sin(run*.5)*.025;ears.forEach(e=>e.e.rotation.x=Math.sin(run+e.s)*.14);tail.rotation.y=Math.sin(run*.6)*.3;rhexi.rotation.z+=(-dx*.085-rhexi.rotation.z)*.17;rhexi.rotation.y+=(-dx*.03-rhexi.rotation.y)*.16;if(jumping){rhexi.position.y+=vy;vy-=.0115;if(rhexi.position.y<=0){rhexi.position.y=0;vy=0;jumping=false}}if(sliding>0){sliding--;rhexi.scale.y+=(.58-rhexi.scale.y)*.25}else rhexi.scale.y+=(1-rhexi.scale.y)*.2;for(const o of obstacles){o.position.z+=speed;if(o.userData.collect)o.rotation.y+=.08;if(o.position.z>15){o.position.z-=210;o.visible=true;o.userData.hit=false}}collide()}camera.position.x+=(rhexi.position.x*.25-camera.position.x)*.08;camera.position.y+=(5.2+rhexi.position.y*.12-camera.position.y)*.08;camera.position.z=10.7;camera.lookAt(rhexi.position.x*.12,2.1,-9.5);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
