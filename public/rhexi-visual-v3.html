<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>RHEXI RUN Visual</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#168fea;font-family:system-ui,-apple-system,sans-serif;touch-action:none}.world{position:fixed;inset:-3%;background-image:url('/rhexi-visual-reference.webp');background-position:center;background-size:cover;background-repeat:no-repeat;transform:scale(1.04);transition:transform .12s}.shade{position:fixed;inset:0;background:linear-gradient(180deg,transparent 65%,#1112)}.hud{position:fixed;inset:0;color:#fff;text-shadow:0 3px 5px #0008;pointer-events:none}.top{display:flex;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 14px}.pill{background:#132b54dd;border:3px solid #ffffff88;border-radius:17px;padding:7px 12px;font-weight:1000;font-size:18px}.center{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#292941d9;border:2px solid #fff8;border-radius:22px;padding:9px 22px;font-weight:900;white-space:nowrap}.msg{position:fixed;top:28%;left:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;background:#ff2e91e8;border:3px solid white;border-radius:20px;padding:12px 18px;font-weight:1000;transition:.15s}.msg.on{opacity:1;transform:translate(-50%,-50%) scale(1)}.start{position:fixed;inset:0;display:grid;place-items:center;background:#06152d55;z-index:5}.card{background:#10182eea;border:3px solid #fff9;border-radius:28px;color:#fff;text-align:center;padding:22px;width:min(86vw,390px);box-shadow:0 20px 60px #0008}.card h1{margin:0;font-size:34px}.card b{color:#ffdf00}.card button{font:inherit;font-weight:1000;font-size:20px;color:white;background:#ff2e91;border:0;border-radius:18px;padding:13px 28px;box-shadow:0 6px 0 #9b1258}.hidden{display:none}.flash{animation:flash .2s}@keyframes flash{50%{filter:brightness(1.5) saturate(1.35)}}</style></head><body><div id="world" class="world"></div><div class="shade"></div><div id="start" class="start"><div class="card"><h1>RHEXI <b>RUN</b></h1><p>Iguala · prueba visual jugable</p><button id="play">JUGAR</button><p>Desliza ← → · ↑ salta · ↓ esquiva</p></div></div><div class="hud"><div class="top"><div class="pill">🟡 <span id="coins">126</span></div><div class="pill">SCORE <span id="score">000000</span> ×3</div></div><div id="msg" class="msg"></div><div class="center">← &nbsp; DESLIZA PARA MOVERTE &nbsp; →</div></div><script>let playing=false,lane=1,score=0,coins=126,sx=0,sy=0,t=0;const world=document.getElementById('world'),msg=document.getElementById('msg');function say(x){msg.textContent=x;msg.classList.add('on');setTimeout(()=>msg.classList.remove('on'),500)}function move(d){if(!playing)return;lane=Math.max(0,Math.min(2,lane+d));const x=(lane-1)*5;world.style.transform=`scale(1.07) translateX(${-x}px)`;say(d<0?'← IZQUIERDA':'DERECHA →')}function jump(){if(!playing)return;world.animate([{transform:world.style.transform+' translateY(0)'},{transform:world.style.transform+' translateY(22px)'},{transform:world.style.transform+' translateY(0)'}],{duration:520,easing:'ease-out'});say('↑ SALTO')}function slide(){if(!playing)return;world.animate([{filter:'brightness(1)'},{filter:'brightness(.8)'},{filter:'brightness(1)'}],{duration:360});say('↓ ESQUIVA')}document.getElementById('play').onclick=()=>{playing=true;document.getElementById('start').classList.add('hidden')};addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>25)move(dx>0?1:-1);else if(Math.abs(dy)>25)(dy<0?jump():slide())},{passive:true});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='ArrowUp'||e.key===' ')jump();if(e.key==='ArrowDown')slide()});function loop(){requestAnimationFrame(loop);if(!playing)return;t++;score+=3;document.getElementById('score').textContent=String(score).padStart(6,'0');world.style.backgroundPosition=`center ${50+(Math.sin(t*.025)*.35)}%`;if(t%170===0){coins++;document.getElementById('coins').textContent=coins;world.classList.add('flash');setTimeout(()=>world.classList.remove('flash'),220)}}loop();</script></body></html>
