<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>RHEXI RUN V9</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(#72d9ff,#f6c46f);font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none;color:#fff;font-weight:900;text-shadow:0 3px 8px #0008}.top{display:flex;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 12px;gap:8px}.pill{background:#102347e8;border:2px solid #ffffffb8;border-radius:22px;padding:8px 12px;font-size:15px}.hint{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#14213ce8;border:2px solid #ffffffaa;border-radius:26px;padding:10px 16px;white-space:nowrap;font-size:13px}.start{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#06132966;backdrop-filter:blur(3px)}.card{width:min(88vw,420px);background:#0f1930f2;border:3px solid #ffffffb0;border-radius:30px;padding:26px;text-align:center;color:#fff;box-shadow:0 20px 60px #0007}.card h1{font-size:42px;margin:0}.pink{color:#ff3296}.yellow{color:#ffe028}.card button{font:inherit;font-weight:1000;font-size:22px;color:white;background:#ff3296;border:0;border-radius:20px;padding:15px 34px;min-width:170px}.hidden{display:none}.badge{position:fixed;right:12px;bottom:82px;background:#0d1e3de8;color:#fff;border:2px solid #fff9;border-radius:15px;padding:9px 11px;font-size:11px;font-weight:900;z-index:3}.brand{position:fixed;left:12px;bottom:82px;background:#121c37d9;border:2px solid #fff8;border-radius:15px;padding:8px 11px;color:#fff;font-weight:900;font-size:11px;z-index:3}</style></head><body><div id="start" class="start"><div class="card"><h1>RHEXI <span class="pink">RUN</span></h1><p class="yellow"><b>IGUALA · V9</b></p><p>RHEXI integrado sin carga externa.</p><button id="play">JUGAR</button><p>Desliza ← → · ↑ salta · ↓ esquiva</p></div></div><div class="hud"><div class="top"><div class="pill">🟡 <span id="coins">0</span></div><div class="pill">SCORE <span id="score">000000</span> ×<span id="mult">1</span></div><div class="pill">❤️ <span id="lives">3</span></div></div><div class="hint">← DESLIZA · ↑ SALTA · ↓ ESQUIVA →</div></div><div class="brand">RHEVOLVER NEWS</div><div class="badge" id="badge">RHEXI LISTO</div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x72d7fb);scene.fog=new THREE.FogExp2(0x9de4f4,.012);const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,280);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x73502e,2.7));const sun=new THREE.DirectionalLight(0xffe1aa,4.6);sun.position.set(-13,25,16);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const mat=(c,r=.75,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const mesh=(g,c,r=.75,m=0)=>{const q=new THREE.Mesh(g,mat(c,r,m));q.castShadow=q.receiveShadow=true;return q};const box=(x,y,z,c,r=.75)=>mesh(new THREE.BoxGeometry(x,y,z),c,r);const world=new THREE.Group();scene.add(world);const lanes=[-3,0,3];const road=box(12,.2,320,0x41464e,.9);road.position.set(0,-.1,-150);world.add(road);for(const s of[-1,1]){const sw=box(4,.34,320,s<0?0xe2b264:0xf0c77b,.88);sw.position.set(s*8,.02,-150);world.add(sw)}for(let z=14;z>-280;z-=8.5)for(const x of[-2,2]){const ln=box(.12,.025,3.6,0xffffff);ln.position.set(x,.02,z);world.add(ln)}const cols=[0xf07261,0x49c6c8,0xf0c54c,0x74b85e,0x9c78cf,0xe28d4e,0x4c9bc8];for(let z=-8;z>-260;z-=13)for(const s of[-1,1]){const h=5+Math.random()*7,w=4+Math.random()*2,b=box(w,h,8,cols[Math.floor(Math.random()*cols.length)],.9);b.position.set(s*(10.4+Math.random()*1.4),h/2,z);world.add(b);for(let k=0;k<3;k++){const aw=box(w*.85,.18,1.1,k%2?0xffffff:0xffd22e,.8);aw.position.set(b.position.x,1.4+k*1.6,z+4.05);world.add(aw)}}function palm(x,z){const t=mesh(new THREE.CylinderGeometry(.12,.22,4.5,8),0x86532f,.9);t.position.set(x,2.25,z);world.add(t);for(let i=0;i<8;i++){const l=mesh(new THREE.CapsuleGeometry(.06,1.2,4,6),0x29934b,.85);l.position.set(x+Math.cos(i*.78)*.5,4.5,z+Math.sin(i*.78)*.5);l.rotation.z=Math.PI/2;l.rotation.y=i*.78;world.add(l)}}for(let z=-5;z>-240;z-=19){palm(-7.2,z);palm(7.2,z-9)}function arch(z){const c=0xe7c297,l=box(1.25,6.4,1.4,c),r=box(1.25,6.4,1.4,c),t=box(9.2,1.35,1.5,c);l.position.set(-4.5,3.2,z);r.position.set(4.5,3.2,z);t.position.set(0,5.9,z);world.add(l,r,t);const cv=document.createElement('canvas');cv.width=1024;cv.height=256;const x=cv.getContext('2d');x.fillStyle='#e7c297';x.fillRect(0,0,1024,256);x.textAlign='center';x.fillStyle='#5a3524';x.font='900 74px sans-serif';x.fillText('IGUALA DE LA INDEPENDENCIA',512,150);const tx=new THREE.CanvasTexture(cv);const p=new THREE.Mesh(new THREE.PlaneGeometry(7.3,1.35),new THREE.MeshBasicMaterial({map:tx}));p.position.set(0,5.95,z+.78);world.add(p)}arch(-78);function sign(x,z,a,b){const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d');g.fillStyle='#17335e';g.fillRect(0,0,512,256);g.fillStyle='#fff';g.textAlign='center';g.font='900 58px sans-serif';g.fillText(a,256,105);g.fillStyle='#ff3498';g.font='900 42px sans-serif';g.fillText(b,256,175);const t=new THREE.CanvasTexture(c);const p=new THREE.Mesh(new THREE.PlaneGeometry(3.5,1.8),new THREE.MeshBasicMaterial({map:t}));p.position.set(x,3.2,z);p.rotation.y=x<0?.12:-.12;world.add(p)}for(let z=-20;z>-220;z-=40){sign(-6.9,z,'RHEVOLVER','NEWS');sign(6.9,z-20,'IGUALA','CENTRO')}const rhexi=new THREE.Group();scene.add(rhexi);rhexi.position.set(0,0,2.8);const orange=0xd86720,dark=0x9b4418,black=0x111216,white=0xf4f1e8;const torso=mesh(new THREE.CapsuleGeometry(.55,1.1,8,16),orange,.98);torso.position.y=2.1;rhexi.add(torso);const head=mesh(new THREE.SphereGeometry(.72,24,18),orange,.98);head.position.set(0,3.55,-.05);rhexi.add(head);const muzzle=mesh(new THREE.SphereGeometry(.38,20,14),0xe9914c,.98);muzzle.scale.set(1,.72,.9);muzzle.position.set(0,3.35,-.61);rhexi.add(muzzle);const nose=mesh(new THREE.SphereGeometry(.17,18,14),black,.45,.1);nose.position.set(0,3.42,-.9);rhexi.add(nose);for(const s of[-1,1]){const ear=mesh(new THREE.CapsuleGeometry(.18,.62,6,10),dark,.99);ear.position.set(s*.55,3.55,.03);ear.rotation.z=s*.28;ear.rotation.x=.15;rhexi.add(ear);ear.name=s<0?'EarL':'EarR';const lens=box(.48,.27,.12,black,.3);lens.position.set(s*.27,3.72,-.64);rhexi.add(lens)}const bridge=box(.22,.06,.1,black,.3);bridge.position.set(0,3.72,-.66);rhexi.add(bridge);const band=mesh(new THREE.TorusGeometry(.52,.12,8,22),black,.7);band.rotation.x=Math.PI/2;band.position.set(0,2.85,-.03);rhexi.add(band);const knot=mesh(new THREE.ConeGeometry(.18,.55,8),black,.75);knot.rotation.x=Math.PI/2;knot.position.set(.38,2.72,.36);rhexi.add(knot);const limbs={};for(const s of[-1,1]){const arm=mesh(new THREE.CapsuleGeometry(.13,.9,6,10),orange,.98);arm.position.set(s*.67,2.1,-.02);arm.rotation.z=s*.08;rhexi.add(arm);limbs[s<0?'armL':'armR']=arm;const leg=mesh(new THREE.CapsuleGeometry(.17,1.0,6,10),orange,.98);leg.position.set(s*.28,.9,0);rhexi.add(leg);limbs[s<0?'legL':'legR']=leg;const shoe=box(.48,.3,.72,white,.45);shoe.position.set(s*.28,.18,-.18);rhexi.add(shoe);const sole=box(.5,.07,.76,black,.55);sole.position.set(s*.28,.02,-.18);rhexi.add(sole)}const tail=mesh(new THREE.CapsuleGeometry(.12,.65,6,10),dark,.98);tail.position.set(0,1.9,.55);tail.rotation.x=-.8;rhexi.add(tail);const shadow=mesh(new THREE.CircleGeometry(.95,24),0x000000,.9);shadow.material.transparent=true;shadow.material.opacity=.22;shadow.rotation.x=-Math.PI/2;shadow.position.set(0,.015,2.8);scene.add(shadow);const objs=[];function obj(type,l,z){const g=new THREE.Group();let q;if(type==='coin'){q=mesh(new THREE.CylinderGeometry(.35,.35,.12,22),0xffd11a,.22,.65);q.rotation.z=Math.PI/2;q.position.y=1.05}else if(type==='pothole'){q=mesh(new THREE.CylinderGeometry(.72,1.05,.06,20),0x121417,.96);q.scale.z=1.35;q.position.y=.02}else if(type==='puddle'){q=mesh(new THREE.CircleGeometry(.95,24),0x48c8f2,.12);q.material.transparent=true;q.material.opacity=.65;q.rotation.x=-Math.PI/2;q.scale.y=.52;q.position.y=.03}else if(type==='stall'){q=box(1.65,1.05,1.1,0xe96b37);q.position.y=.53;g.add(q);const roof=box(2.1,.16,1.55,0xffd329);roof.position.y=2.03;g.add(roof);q=null}else{q=box(1.85,1.7,3,0xf2f4f5);q.position.y=.86;const stripe=box(1.87,.18,3.02,0x1793d1);stripe.position.y=1;g.add(stripe)}if(q)g.add(q);g.position.set(lanes[l],0,z);g.userData={type,hit:false};world.add(g);objs.push(g)}for(let z=-14;z>-250;z-=5.9){const l=Math.floor(Math.random()*3),r=Math.random();obj(r<.46?'coin':r<.61?'pothole':r<.72?'puddle':r<.86?'stall':'van',l,z);if(Math.random()>.38)obj('coin',(l+1)%3,z-2.6)}let playing=false,lane=1,target=0,vy=0,jump=false,slide=0,score=0,coins=0,lives=3,mult=1,speed=.24,t=0,immune=0;const $=x=>document.getElementById(x);function move(d){if(!playing)return;lane=Math.max(0,Math.min(2,lane+d));target=lanes[lane]}function up(){if(playing&&!jump){jump=true;vy=.21}}function down(){if(playing&&!jump)slide=34}let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>24)move(dx>0?1:-1);else if(Math.abs(dy)>24)(dy<0?up():down())},{passive:true});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')up();if(e.key==='ArrowDown'||e.key==='s')down()});$('play').onclick=()=>{playing=true;$('start').classList.add('hidden')};function hit(type){if(immune)return;if(type==='puddle'){speed*=.72;return}lives--;immune=65;$('lives').textContent=lives;if(lives<=0){playing=false;$('start').classList.remove('hidden');$('play').textContent='REINTENTAR'}}function collision(){for(const o of objs){if(o.userData.hit||!o.visible)continue;if(Math.abs(o.position.z-rhexi.position.z)<1&&Math.abs(o.position.x-rhexi.position.x)<.9){const ty=o.userData.type;if(ty==='coin'){o.userData.hit=true;o.visible=false;coins++;score+=120*mult;$('coins').textContent=coins;if(coins%12===0&&mult<5){mult++;$('mult').textContent=mult}continue}if(ty==='pothole'&&rhexi.position.y>.72)continue;if(ty==='stall'&&slide>8)continue;o.userData.hit=true;hit(ty)}}}function animate(){requestAnimationFrame(animate);t+=1/60;if(playing){speed+=(Math.min(.49,.24+score/150000)-speed)*.008;score+=speed*5*mult;$('score').textContent=String(Math.floor(score)).padStart(6,'0');if(immune)immune--;const dx=target-rhexi.position.x;rhexi.position.x+=dx*.18;shadow.position.x=rhexi.position.x;const run=t*(14+speed*10);limbs.legL.rotation.x=Math.sin(run)*.72;limbs.legR.rotation.x=-Math.sin(run)*.72;limbs.armL.rotation.x=-Math.sin(run)*.62;limbs.armR.rotation.x=Math.sin(run)*.62;tail.rotation.y=Math.sin(run*.52)*.35;const bounce=Math.abs(Math.sin(run))*.06;torso.position.y=2.1+bounce;head.position.y=3.55+bounce*.8;rhexi.rotation.z+=(-dx*.085-rhexi.rotation.z)*.18;if(jump){rhexi.position.y+=vy;vy-=.012;if(rhexi.position.y<=0){rhexi.position.y=0;vy=0;jump=false}}if(slide>0){slide--;rhexi.scale.y+=(.7-rhexi.scale.y)*.24}else rhexi.scale.y+=(1-rhexi.scale.y)*.2;for(const o of objs){o.position.z+=speed;if(o.userData.type==='coin')o.rotation.y+=.09;if(o.position.z>16){o.position.z-=245;o.visible=true;o.userData.hit=false}}collision()}camera.position.x+=(rhexi.position.x*.22-camera.position.x)*.08;camera.position.y+=(5.5+rhexi.position.y*.15-camera.position.y)*.08;camera.position.z=10.4;camera.lookAt(rhexi.position.x*.1,2.25,-12);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
