<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>RHEXI RUN V7</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#5ec9ef;font-family:system-ui,-apple-system,sans-serif;touch-action:none}body:before{content:"";position:fixed;inset:0;background:url('https://raw.githubusercontent.com/rhevolvernews/rhevolver-news/preview/rhexi-3d/public/rhexi-visual-reference.webp') center 42%/cover no-repeat;filter:saturate(1.06) brightness(1.02);z-index:-3}body:after{content:"";position:fixed;inset:0;background:linear-gradient(#59c9ef33 0 35%,#6ec8ef12 55%,#00000018 100%);z-index:-2}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none;color:#fff;font-weight:900;text-shadow:0 3px 8px #0008}.top{display:flex;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 12px;gap:8px}.pill{background:#14254de8;border:3px solid #ffffffa8;border-radius:22px;padding:8px 12px;font-size:15px;box-shadow:0 6px 18px #0003}.hint{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#18213eea;border:3px solid #ffffffa0;border-radius:28px;padding:10px 17px;white-space:nowrap;font-size:14px}.start{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#06132977;backdrop-filter:blur(3px)}.card{width:min(88vw,420px);background:#0f1930f2;border:3px solid #ffffffa8;border-radius:30px;padding:26px;text-align:center;color:white;box-shadow:0 20px 60px #0007}.card h1{font-size:42px;margin:0}.pink{color:#ff3296}.yellow{color:#ffe028}.card button{font:inherit;font-weight:1000;font-size:22px;color:white;background:#ff3296;border:0;border-radius:20px;padding:15px 34px;min-width:170px;box-shadow:0 8px 20px #ff329655}.card button:disabled{opacity:.45}.hidden{display:none}.badge{position:fixed;right:12px;bottom:82px;background:#0d1e3de8;color:#fff;border:2px solid #fff9;border-radius:15px;padding:9px 11px;font-size:11px;font-weight:900;z-index:3}.brand{position:fixed;left:12px;bottom:82px;background:#121c37d9;border:2px solid #fff8;border-radius:15px;padding:8px 11px;color:#fff;font-weight:900;font-size:11px;z-index:3}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><div id="start" class="start"><div class="card"><h1>RHEXI <span class="pink">RUN</span></h1><p class="yellow"><b>IGUALA · V7</b></p><p id="loadtxt">Preparando a RHEXI…</p><button id="play" disabled>JUGAR</button><p>Desliza ← → · ↑ salta · ↓ esquiva</p></div></div><div class="hud"><div class="top"><div class="pill">🟡 <span id="coins">0</span></div><div class="pill">SCORE <span id="score">000000</span> ×<span id="mult">1</span></div><div class="pill">❤️ <span id="lives">3</span></div></div><div class="hint">← DESLIZA · ↑ SALTA · ↓ ESQUIVA →</div></div><div class="brand">RHEVOLVER NEWS</div><div class="badge" id="badge">CARGANDO RHEXI…</div><script type="module">import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const scene=new THREE.Scene();scene.background=null;scene.fog=new THREE.FogExp2(0xb9e8f6,.018);const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,240);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x6d5a3e,2.2));const sun=new THREE.DirectionalLight(0xffe3b4,4.4);sun.position.set(-12,24,14);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const M=(c,r=.72,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const box=(x,y,z,c,r=.72)=>{const q=new THREE.Mesh(new THREE.BoxGeometry(x,y,z),M(c,r));q.castShadow=q.receiveShadow=true;return q};const world=new THREE.Group();scene.add(world);const lanes=[-3,0,3];const road=box(12,.18,300,0x3f444d,.9);road.position.set(0,-.1,-140);world.add(road);for(const s of[-1,1]){const sw=box(3.4,.3,300,s<0?0xd5b16b:0xe0b778,.88);sw.position.set(s*7.7,.03,-140);world.add(sw)}for(let z=12;z>-270;z-=8.5)for(const x of[-2,2]){const ln=box(.12,.024,3.6,0xffffff);ln.position.set(x,.02,z);world.add(ln)}function pole(x,z){const p=new THREE.Mesh(new THREE.CylinderGeometry(.06,.08,3.7,8),M(0x30343a,.45,.2));p.position.set(x,1.85,z);world.add(p);const a=box(.85,.06,.06,0x30343a,.5);a.position.set(x+(x<0?.4:-.4),3.65,z);world.add(a);const l=new THREE.PointLight(0xffdca6,.45,7);l.position.set(x+(x<0?.75:-.75),3.55,z);world.add(l)}for(let z=-5;z>-240;z-=18){pole(-6.7,z);pole(6.7,z-8)}function palm(x,z){const t=new THREE.Mesh(new THREE.CylinderGeometry(.11,.2,4.2,8),M(0x87552e,.9));t.position.set(x,2.1,z);world.add(t);for(let i=0;i<7;i++){const leaf=new THREE.Mesh(new THREE.CapsuleGeometry(.06,1.05,4,6),M(0x2b9f50,.85));leaf.position.set(x+Math.cos(i*.9)*.48,4.25,z+Math.sin(i*.9)*.48);leaf.rotation.z=Math.PI/2;leaf.rotation.y=i*.9;world.add(leaf)}}for(let z=-2;z>-230;z-=22){palm(-7.2,z);palm(7.2,z-11)}function signTexture(a,b,bg='#18345d'){const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d');g.fillStyle=bg;g.fillRect(0,0,512,256);g.fillStyle='#fff';g.textAlign='center';g.font='900 60px sans-serif';g.fillText(a,256,105);g.fillStyle='#ff3498';g.font='900 44px sans-serif';g.fillText(b,256,174);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}function billboard(x,z,a='RHEVOLVER',b='NEWS'){const m=new THREE.Mesh(new THREE.PlaneGeometry(3.6,1.8),new THREE.MeshBasicMaterial({map:signTexture(a,b),transparent:true}));m.position.set(x,3.2,z);m.rotation.y=x<0?.12:-.12;world.add(m)}for(let z=-18;z>-210;z-=42){billboard(-6.9,z);billboard(6.9,z-20)}function arch(z){const c=0xe7c79c,l=box(1.1,6.2,1.2,c),r=box(1.1,6.2,1.2,c),t=box(9,1.3,1.4,c);l.position.set(-4.3,3.1,z);r.position.set(4.3,3.1,z);t.position.set(0,5.75,z);world.add(l,r,t);const s=new THREE.Mesh(new THREE.PlaneGeometry(6.5,1.1),new THREE.MeshBasicMaterial({map:signTexture('IGUALA','DE LA INDEPENDENCIA','#cfae7d')}));s.position.set(0,5.9,z+.73);world.add(s)}arch(-78);const rhexi=new THREE.Group();scene.add(rhexi);rhexi.position.set(0,0,2.8);const shadow=new THREE.Mesh(new THREE.CircleGeometry(.95,28),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.25}));shadow.rotation.x=-Math.PI/2;shadow.position.set(0,.015,2.8);scene.add(shadow);let model=null;const nodes={};const play=document.getElementById('play'),badge=document.getElementById('badge'),loadtxt=document.getElementById('loadtxt');const GLB='https://raw.githubusercontent.com/rhevolvernews/rhevolver-news/preview/rhexi-3d/public/rhexi-assets/RHEXI_ultralight.glb';const loader=new GLTFLoader();fetch(GLB,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.arrayBuffer()}).then(buf=>loader.parse(buf,'',g=>{model=g.scene;model.rotation.y=Math.PI;model.scale.setScalar(1.05);model.position.y=.02;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}if(o.name)nodes[o.name]=o});rhexi.add(model);badge.textContent='RHEXI LISTO';loadtxt.textContent='RHEXI listo para correr';play.disabled=false;},e=>{throw e})).catch(e=>{badge.textContent='ERROR RHEXI';loadtxt.textContent='No se pudo cargar RHEXI';console.error(e)});const objs=[];function obj(type,l,z){const g=new THREE.Group();let q;if(type==='coin'){q=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.12,22),new THREE.MeshStandardMaterial({color:0xffd117,emissive:0xffa500,emissiveIntensity:.25,metalness:.7,roughness:.22}));q.rotation.z=Math.PI/2;q.position.y=1.05}else if(type==='pothole'){q=new THREE.Mesh(new THREE.CylinderGeometry(.72,1.0,.06,20),M(0x141518,.95));q.scale.z=1.35;q.position.y=.02}else if(type==='stall'){q=box(1.65,1.05,1.1,0xe96b37);q.position.y=.53;g.add(q);const roof=box(2.1,.16,1.55,0xffd329);roof.position.y=2.03;g.add(roof);const tag=new THREE.Mesh(new THREE.PlaneGeometry(1.3,.45),new THREE.MeshBasicMaterial({map:signTexture('ELOTES','', '#d94f2b')}));tag.position.set(0,1.25,.58);g.add(tag);q=null}else if(type==='van'){q=box(1.85,1.7,3,0xf2f4f5);q.position.y=.86;const stripe=box(1.87,.18,3.02,0x1793d1);stripe.position.y=1.0;g.add(stripe)}else{q=new THREE.Mesh(new THREE.CircleGeometry(.9,24),new THREE.MeshStandardMaterial({color:0x49c5f0,transparent:true,opacity:.65,roughness:.15}));q.rotation.x=-Math.PI/2;q.scale.y=.52;q.position.y=.03}if(q)g.add(q);g.position.set(lanes[l],0,z);g.userData={type,hit:false};world.add(g);objs.push(g)}for(let z=-14;z>-250;z-=5.9){const l=Math.floor(Math.random()*3),r=Math.random();obj(r<.46?'coin':r<.61?'pothole':r<.72?'puddle':r<.86?'stall':'van',l,z);if(Math.random()>.38)obj('coin',(l+1)%3,z-2.6)}let playing=false,lane=1,target=0,vy=0,jump=false,slide=0,score=0,coins=0,lives=3,mult=1,speed=.24,t=0,immune=0;const $=x=>document.getElementById(x);function move(d){if(!playing)return;lane=Math.max(0,Math.min(2,lane+d));target=lanes[lane]}function up(){if(playing&&!jump){jump=true;vy=.21}}function down(){if(playing&&!jump)slide=34}let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>24)move(dx>0?1:-1);else if(Math.abs(dy)>24)(dy<0?up():down())},{passive:true});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')up();if(e.key==='ArrowDown'||e.key==='s')down()});play.onclick=()=>{if(!model)return;playing=true;$('start').classList.add('hidden')};function hit(type){if(immune)return;if(type==='puddle'){speed*=.72;return}lives--;immune=65;$('lives').textContent=lives;if(lives<=0){playing=false;$('start').classList.remove('hidden');play.textContent='REINTENTAR'}}function collision(){for(const o of objs){if(o.userData.hit||!o.visible)continue;if(Math.abs(o.position.z-rhexi.position.z)<1.0&&Math.abs(o.position.x-rhexi.position.x)<.9){const ty=o.userData.type;if(ty==='coin'){o.userData.hit=true;o.visible=false;coins++;score+=120*mult;$('coins').textContent=coins;if(coins%12===0&&mult<5){mult++;$('mult').textContent=mult}continue}if(ty==='pothole'&&rhexi.position.y>.72)continue;if(ty==='stall'&&slide>8)continue;o.userData.hit=true;hit(ty)}}}function animModel(run){if(!model)return;const la=nodes['Leg-1'],lb=nodes['Leg1'],aa=nodes['Arm-1'],ab=nodes['Arm1'],tail=nodes['Tail'],ea=nodes['Ear-1'],eb=nodes['Ear1'];if(la)la.rotation.x=Math.sin(run)*.78;if(lb)lb.rotation.x=-Math.sin(run)*.78;if(aa)aa.rotation.x=-Math.sin(run)*.68;if(ab)ab.rotation.x=Math.sin(run)*.68;if(tail)tail.rotation.y=Math.sin(run*.52)*.38;if(ea)ea.rotation.x=Math.sin(run+1)*.12;if(eb)eb.rotation.x=Math.sin(run-1)*.12;model.position.y=.02+Math.abs(Math.sin(run))*.08;const sy=slide>0?.67:1.05;model.scale.y+=(sy-model.scale.y)*.22}function animate(){requestAnimationFrame(animate);t+=1/60;if(playing){speed+=(Math.min(.48,.24+score/150000)-speed)*.008;score+=speed*5*mult;$('score').textContent=String(Math.floor(score)).padStart(6,'0');if(immune)immune--;const dx=target-rhexi.position.x;rhexi.position.x+=dx*.18;shadow.position.x=rhexi.position.x;animModel(t*(14+speed*10));rhexi.rotation.z+=(-dx*.09-rhexi.rotation.z)*.2;if(jump){rhexi.position.y+=vy;vy-=.0125;if(rhexi.position.y<=0){rhexi.position.y=0;vy=0;jump=false}}if(slide>0)slide--;for(const o of objs){o.position.z+=speed;if(o.userData.type==='coin')o.rotation.y+=.1;if(o.position.z>17){o.position.z-=252;o.visible=true;o.userData.hit=false}}collision()}camera.position.x+=(rhexi.position.x*.2-camera.position.x)*.08;camera.position.y+=(5.25+rhexi.position.y*.16-camera.position.y)*.08;camera.position.z=10.4;camera.lookAt(rhexi.position.x*.08,2.05,-12);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
