<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>RHEXI RUN V6 GLB</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#58c9f5;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none;color:#fff;font-weight:900;text-shadow:0 3px 8px #0008}.top{display:flex;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 14px}.pill{background:#15284de8;border:3px solid #ffffff9c;border-radius:20px;padding:8px 13px;font-size:16px}.hint{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#20263ee8;border:3px solid #ffffff9c;border-radius:28px;padding:10px 18px;white-space:nowrap}.start{position:fixed;inset:0;z-index:4;display:grid;place-items:center;background:#07152d77}.card{width:min(88vw,410px);background:#101a32ef;border:3px solid #fff9;border-radius:28px;padding:25px;text-align:center;color:white}.card h1{font-size:40px;margin:0}.pink{color:#ff3196}.yellow{color:#ffe128}.card button{font:inherit;font-weight:1000;font-size:22px;color:white;background:#ff3196;border:0;border-radius:18px;padding:14px 32px}.hidden{display:none}.badge{position:fixed;right:12px;bottom:82px;background:#0d1e3dd9;color:#fff;border:2px solid #fff8;border-radius:14px;padding:8px 10px;font-size:11px;font-weight:800}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><div id="start" class="start"><div class="card"><h1>RHEXI <span class="pink">RUN</span></h1><p class="yellow"><b>IGUALA · V6 GLB</b></p><p>Versión de prueba con modelo GLB integrado.</p><button id="play">JUGAR</button><p>← → carriles · ↑ salto · ↓ deslizar</p></div></div><div class="hud"><div class="top"><div class="pill">🟡 <span id="coins">0</span></div><div class="pill">SCORE <span id="score">000000</span> ×<span id="mult">1</span></div><div class="pill">❤️ <span id="lives">3</span></div></div><div class="hint">← DESLIZA · ↑ SALTA · ↓ ESQUIVA →</div></div><div class="badge" id="badge">INICIANDO MOTOR 3D…</div><script type="module">import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x66cef5);scene.fog=new THREE.FogExp2(0x7bcfed,.011);const camera=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.1,260);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe9fbff,0x73552d,3));const sun=new THREE.DirectionalLight(0xffe1b0,4.2);sun.position.set(-15,25,14);sun.castShadow=true;scene.add(sun);const M=(c,r=.75)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const box=(x,y,z,c,r=.75)=>{const q=new THREE.Mesh(new THREE.BoxGeometry(x,y,z),M(c,r));q.castShadow=q.receiveShadow=true;return q};const world=new THREE.Group();scene.add(world);const lanes=[-3,0,3];const road=box(12,.22,280,0x414650,.88);road.position.set(0,-.11,-128);world.add(road);for(const s of[-1,1]){const sw=box(5,.35,280,s<0?0xf7b943:0xf39a54);sw.position.set(s*8.5,.05,-128);world.add(sw)}for(let z=10;z>-255;z-=9)for(const x of[-2,2]){const ln=box(.12,.025,3.8,0xffffff);ln.position.set(x,.03,z);world.add(ln)}const cols=[0xff7c68,0x2bc5c5,0xffd85c,0x77c96b,0x9a72d4,0xf39a55,0x48a9db];for(let z=2;z>-245;z-=11)for(const s of[-1,1]){const h=5+Math.random()*7,w=4+Math.random()*2,b=box(w,h,7.4,cols[Math.floor(Math.random()*cols.length)],.84);b.position.set(s*(10.4+Math.random()*1.2),h/2,z);world.add(b)}const rhexi=new THREE.Group();scene.add(rhexi);rhexi.position.set(0,0,2.7);let model=null;const nodes={};new GLTFLoader().load('/rhexi-assets/RHEXI_ultralight.glb',g=>{model=g.scene;model.rotation.y=Math.PI;model.scale.setScalar(.9);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}if(o.name)nodes[o.name]=o});rhexi.add(model);document.getElementById('badge').textContent='RHEXI GLB ACTIVO';},undefined,e=>{document.getElementById('badge').textContent='GLB NO DISPONIBLE';console.error(e)});const shadow=new THREE.Mesh(new THREE.CircleGeometry(1,28),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.25}));shadow.rotation.x=-Math.PI/2;shadow.position.set(0,.02,2.7);scene.add(shadow);const objs=[];function obj(type,l,z){const g=new THREE.Group(),q=type==='coin'?new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.13,20),new THREE.MeshStandardMaterial({color:0xffd31e,metalness:.6})):type==='pothole'?new THREE.Mesh(new THREE.CylinderGeometry(.72,1.05,.08,20),M(0x111318,.95)):box(type==='stall'?1.7:1.9,type==='stall'?1.05:1.8,type==='stall'?1.15:3.2,type==='stall'?0xe96638:0xe8edf2);q.position.y=type==='coin'?1.05:type==='pothole'?.03:.7;if(type==='coin')q.rotation.z=Math.PI/2;g.add(q);g.position.set(lanes[l],0,z);g.userData={type,hit:false};world.add(g);objs.push(g)}for(let z=-16;z>-240;z-=6.3){const l=Math.floor(Math.random()*3),r=Math.random();obj(r<.48?'coin':r<.68?'pothole':r<.84?'stall':'van',l,z);if(Math.random()>.45)obj('coin',(l+1)%3,z-2.7)}let playing=false,lane=1,target=0,vy=0,jump=false,slide=0,score=0,coins=0,lives=3,mult=1,speed=.235,t=0,immune=0;const $=x=>document.getElementById(x);function move(d){if(playing){lane=Math.max(0,Math.min(2,lane+d));target=lanes[lane]}}function up(){if(playing&&!jump){jump=true;vy=.2}}function down(){if(playing&&!jump)slide=34}let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>25)move(dx>0?1:-1);else if(Math.abs(dy)>25)(dy<0?up():down())},{passive:true});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='ArrowUp'||e.key===' ')up();if(e.key==='ArrowDown')down()});$('play').addEventListener('click',()=>{playing=true;$('start').classList.add('hidden')});function hit(){if(immune)return;lives--;immune=65;$('lives').textContent=lives;if(lives<=0){playing=false;$('start').classList.remove('hidden');$('play').textContent='REINTENTAR'}}function collision(){for(const o of objs){if(o.userData.hit||!o.visible)continue;if(Math.abs(o.position.z-rhexi.position.z)<1.05&&Math.abs(o.position.x-rhexi.position.x)<.95){if(o.userData.type==='coin'){o.userData.hit=true;o.visible=false;coins++;score+=130*mult;$('coins').textContent=coins;continue}if(o.userData.type==='pothole'&&rhexi.position.y>.72)continue;o.userData.hit=true;hit()}}}function animateModel(run){if(!model)return;for(const [n,s] of [['Leg-1',1],['Leg1',-1],['Arm-1',-1],['Arm1',1]])if(nodes[n])nodes[n].rotation.x=Math.sin(run)*.7*s;if(nodes['Tail'])nodes['Tail'].rotation.y=Math.sin(run*.5)*.35;model.position.y=Math.abs(Math.sin(run))*.07}function animate(){requestAnimationFrame(animate);t+=1/60;if(playing){score+=speed*5*mult;$('score').textContent=String(Math.floor(score)).padStart(6,'0');if(immune)immune--;const dx=target-rhexi.position.x;rhexi.position.x+=dx*.18;shadow.position.x=rhexi.position.x;animateModel(t*16);if(jump){rhexi.position.y+=vy;vy-=.012;if(rhexi.position.y<=0){rhexi.position.y=0;vy=0;jump=false}}if(slide>0)slide--;for(const o of objs){o.position.z+=speed;if(o.userData.type==='coin')o.rotation.y+=.09;if(o.position.z>16){o.position.z-=240;o.visible=true;o.userData.hit=false}}collision()}camera.position.x+=(rhexi.position.x*.2-camera.position.x)*.08;camera.position.y=5.4;camera.position.z=10.2;camera.lookAt(rhexi.position.x*.1,2.15,-11);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
