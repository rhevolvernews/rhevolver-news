<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>RHEXI RUN V5</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#55c9ff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none;color:#fff;font-weight:900;text-shadow:0 3px 8px #0008}.top{display:flex;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 14px}.pill{background:#15284de8;border:3px solid #ffffff9c;border-radius:20px;padding:8px 13px;font-size:17px}.hint{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#20263ee8;border:3px solid #ffffff9c;border-radius:28px;padding:10px 22px;white-space:nowrap}.start{position:fixed;inset:0;z-index:4;display:grid;place-items:center;background:#07152d77}.card{width:min(88vw,410px);background:#101a32ef;border:3px solid #fff9;border-radius:28px;padding:25px;text-align:center;color:white}.card h1{font-size:42px;margin:0}.pink{color:#ff3196}.yellow{color:#ffe128}.card button{font:inherit;font-weight:1000;font-size:22px;color:white;background:#ff3196;border:0;border-radius:18px;padding:14px 32px}.hidden{display:none}</style></head><body><div id="start" class="start"><div class="card"><h1>RHEXI <span class="pink">RUN</span></h1><p class="yellow"><b>IGUALA · V5</b></p><p>Corre por Iguala, junta tamarindos y esquiva el caos de la ciudad.</p><button id="play">JUGAR</button><p>← → carriles · ↑ salto · ↓ deslizar</p></div></div><div class="hud"><div class="top"><div class="pill">🟡 <span id="coins">0</span></div><div class="pill">SCORE <span id="score">000000</span> ×<span id="mult">1</span></div><div class="pill">❤️ <span id="lives">3</span></div></div><div class="hint">← DESLIZA · ↑ SALTA · ↓ ESQUIVA →</div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x62cdf4);scene.fog=new THREE.FogExp2(0x78d0ec,.011);const camera=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.1,260);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.55));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdff7ff,0x73552d,3.2));const sun=new THREE.DirectionalLight(0xffe5bc,4.8);sun.position.set(-15,25,14);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=22;sun.shadow.camera.bottom=-22;scene.add(sun);const M=(c,r=.7,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const box=(x,y,z,c,r=.7)=>{const q=new THREE.Mesh(new THREE.BoxGeometry(x,y,z),M(c,r));q.castShadow=q.receiveShadow=true;return q};const world=new THREE.Group();scene.add(world);const lanes=[-3,0,3];const road=box(12,.22,280,0x414650,.85);road.position.set(0,-.11,-128);world.add(road);for(const s of[-1,1]){const sw=box(5,.35,280,s<0?0xf7b943:0xf39c54);sw.position.set(s*8.5,.05,-128);world.add(sw)}for(let z=10;z>-255;z-=9)for(const x of[-2,2]){const ln=box(.12,.025,3.8,0xffffff);ln.position.set(x,.03,z);world.add(ln)}const cols=[0xff7c68,0x2bc5c5,0xffd85c,0x77c96b,0x9a72d4,0xf39a55,0x48a9db];for(let z=2;z>-245;z-=10){for(const s of[-1,1]){const h=5+Math.random()*8,w=4+Math.random()*2;const b=box(w,h,7.4,cols[Math.floor(Math.random()*cols.length)],.82);b.position.set(s*(10.3+Math.random()*1.4),h/2,z);world.add(b);for(let y=2;y<h-1;y+=2)for(let xx=-1;xx<=1;xx++){const win=box(.6,.7,.08,0x1e4265,.2);win.position.set(b.position.x+xx*.95,y,z+3.75);world.add(win)}const aw=box(w+.25,.3,1.3,Math.random()>.5?0xff2f92:0x24c9b7);aw.position.set(b.position.x,1.6,z+4);world.add(aw)}}function palm(x,z){const t=new THREE.Mesh(new THREE.CylinderGeometry(.13,.25,4.4,8),M(0x89562f,.9));t.position.set(x,2.2,z);world.add(t);for(let i=0;i<8;i++){const l=new THREE.Mesh(new THREE.CapsuleGeometry(.07,1.3,4,6),M(0x2b9c4c,.85));l.position.set(x+Math.cos(i*.785)*.55,4.5,z+Math.sin(i*.785)*.55);l.rotation.z=Math.PI/2;l.rotation.y=i*.785;world.add(l)}}for(let z=-8;z>-235;z-=16){palm(-7.8,z);palm(7.8,z-7)}for(const [x,z,r,h] of[[-20,-150,30,23],[22,-158,27,19],[-2,-175,35,20]]){const q=new THREE.Mesh(new THREE.ConeGeometry(r,h,8),M(0x4e9b5c,.95));q.position.set(x,h/2-2,z);world.add(q)}function canvasSign(text,sub,bg='#17204a'){const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,512,256);x.textAlign='center';x.fillStyle='white';x.font='900 62px sans-serif';x.fillText(text,256,110);x.fillStyle='#ff3296';x.font='900 48px sans-serif';x.fillText(sub,256,176);return new THREE.CanvasTexture(c)}function board(x,z){const g=new THREE.Mesh(new THREE.PlaneGeometry(3.8,2),new THREE.MeshBasicMaterial({map:canvasSign('RHEVOLVER','NEWS')}));g.position.set(x,3.3,z);g.rotation.y=x<0?Math.PI/14:-Math.PI/14;world.add(g);const p=box(.14,4,.14,0x252832);p.position.set(x,1.9,z);world.add(p)}for(let z=-10;z>-220;z-=32){board(-7,z);board(7,z-15)}function arch(z){const l=box(1.3,6.6,1.5,0xeac79f),r=box(1.3,6.6,1.5,0xeac79f),t=box(9.4,1.5,1.7,0xeac79f);l.position.set(-4.5,3.3,z);r.position.set(4.5,3.3,z);t.position.set(0,6,z);world.add(l,r,t);const s=new THREE.Mesh(new THREE.PlaneGeometry(6.7,1.35),new THREE.MeshBasicMaterial({map:canvasSign('IGUALA','DE LA INDEPENDENCIA','#eac79f')}));s.position.set(0,6,z+1);world.add(s)}arch(-76);function light(x,z){const pole=box(.14,5,.14,0x292b30);pole.position.set(x,2.5,z);world.add(pole);const h=box(.8,2.4,.6,0x1b1d23);h.position.set(x,4.8,z);world.add(h);[0xff3449,0xffd22c,0x3bd26d].forEach((c,i)=>{const a=new THREE.Mesh(new THREE.SphereGeometry(.19,10,8),new THREE.MeshBasicMaterial({color:c}));a.position.set(x,5.45-i*.7,z+.33);world.add(a)})}for(let z=-12;z>-225;z-=30){light(-5.8,z);light(5.8,z-10)}const rhexi=new THREE.Group();scene.add(rhexi);rhexi.position.set(0,0,2.7);const fur=M(0xd96a20,.96),fur2=M(0xa84d1e,.98),black=M(0x101114,.7),white=M(0xf7f4ed,.55);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.78,1.18,10,20),fur);body.position.y=2.05;body.castShadow=true;rhexi.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.95,24,20),fur);head.scale.set(1,.95,.88);head.position.set(0,3.35,-.08);head.castShadow=true;rhexi.add(head);const ears=[];for(const s of[-1,1]){const e=new THREE.Mesh(new THREE.CapsuleGeometry(.27,.9,8,14),fur2);e.position.set(s*.83,3.25,.02);e.rotation.z=s*.34;rhexi.add(e);ears.push({e,s})}const band=new THREE.Mesh(new THREE.ConeGeometry(.84,.9,4),black);band.rotation.y=Math.PI/4;band.position.set(0,2.65,.4);rhexi.add(band);for(let i=0;i<14;i++){const d=new THREE.Mesh(new THREE.SphereGeometry(.035,6,5),white);d.position.set((i%7-3)*.17,2.65+Math.floor(i/7)*.13,.84);rhexi.add(d)}const limbs=[];for(const s of[-1,1]){const ag=new THREE.Group(),a=new THREE.Mesh(new THREE.CapsuleGeometry(.21,.95,7,12),fur);a.position.y=-.56;ag.add(a);ag.position.set(s*.83,2.45,0);rhexi.add(ag);limbs.push({g:ag,s,leg:false});const lg=new THREE.Group(),l=new THREE.Mesh(new THREE.CapsuleGeometry(.27,.92,7,12),fur);l.position.y=-.55;lg.add(l);const shoe=new THREE.Mesh(new THREE.SphereGeometry(.37,14,10),black);shoe.scale.set(.9,.55,1.35);shoe.position.set(0,-1.12,-.25);lg.add(shoe);const sole=box(.55,.1,.82,0xffffff,.45);sole.position.set(0,-1.33,-.25);lg.add(sole);lg.position.set(s*.43,1.3,0);rhexi.add(lg);limbs.push({g:lg,s,leg:true})}const tail=new THREE.Mesh(new THREE.CapsuleGeometry(.15,.52,6,10),fur2);tail.position.set(.58,1.8,.65);tail.rotation.z=-.75;rhexi.add(tail);const shadow=new THREE.Mesh(new THREE.CircleGeometry(1,28),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.25}));shadow.rotation.x=-Math.PI/2;shadow.position.set(0,.02,2.7);scene.add(shadow);const objs=[];function obj(type,l,z){const g=new THREE.Group();if(type==='coin'){const q=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.13,24),new THREE.MeshStandardMaterial({color:0xffd31e,emissive:0xff9d00,emissiveIntensity:.4,metalness:.7,roughness:.2}));q.rotation.z=Math.PI/2;q.position.y=1.05;g.add(q)}if(type==='pothole'){const q=new THREE.Mesh(new THREE.CylinderGeometry(.72,1.05,.08,20),M(0x111318,.95));q.scale.z=1.45;q.position.y=.03;g.add(q)}if(type==='puddle'){const q=new THREE.Mesh(new THREE.CircleGeometry(1.05,26),new THREE.MeshStandardMaterial({color:0x40caff,roughness:.1,transparent:true,opacity:.78}));q.rotation.x=-Math.PI/2;q.scale.y=.5;q.position.y=.04;g.add(q)}if(type==='stall'){const b=box(1.7,1.05,1.15,0xe96638);b.position.y=.52;g.add(b);const roof=box(2.3,.18,1.8,0xffd73c);roof.position.y=2.15;g.add(roof);for(const x of[-.78,.78]){const p=box(.07,1.35,.07,0x62503a);p.position.set(x,1.5,0);g.add(p)}}if(type==='van'){const b=box(1.9,1.8,3.2,0xe8edf2);b.position.y=.92;g.add(b);const w=box(1.55,.65,.08,0x162449,.2);w.position.set(0,1.3,1.63);g.add(w);for(const x of[-.7,.7])for(const zz of[-1.08,1.08]){const wh=new THREE.Mesh(new THREE.CylinderGeometry(.27,.27,.17,14),black);wh.rotation.z=Math.PI/2;wh.position.set(x,.28,zz);g.add(wh)}}g.position.set(lanes[l],0,z);g.userData={type,hit:false};world.add(g);objs.push(g)}for(let z=-16;z>-240;z-=6.3){const l=Math.floor(Math.random()*3),r=Math.random();obj(r<.44?'coin':r<.61?'pothole':r<.73?'puddle':r<.88?'stall':'van',l,z);if(Math.random()>.45)obj('coin',(l+1)%3,z-2.7)}let playing=false,lane=1,target=0,vy=0,jump=false,slide=0,score=0,coins=0,lives=3,mult=1,speed=.235,t=0,immune=0;const $=x=>document.getElementById(x);function move(d){if(playing){lane=Math.max(0,Math.min(2,lane+d));target=lanes[lane]}}function up(){if(playing&&!jump){jump=true;vy=.2}}function down(){if(playing&&!jump)slide=34}let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>25)move(dx>0?1:-1);else if(Math.abs(dy)>25)(dy<0?up():down())},{passive:true});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')up();if(e.key==='ArrowDown'||e.key==='s')down()});$('play').onclick=()=>{if(lives<=0){location.reload();return}playing=true;$('start').classList.add('hidden')};function hit(type){if(immune)return;if(type==='puddle'){speed*=.7;return}lives--;immune=65;$('lives').textContent=lives;if(lives<=0){playing=false;$('start').classList.remove('hidden');$('play').textContent='REINTENTAR'}}function collision(){for(const o of objs){if(o.userData.hit||!o.visible)continue;if(Math.abs(o.position.z-rhexi.position.z)<1.05&&Math.abs(o.position.x-rhexi.position.x)<.95){const ty=o.userData.type;if(ty==='coin'){o.userData.hit=true;o.visible=false;coins++;score+=130*mult;$('coins').textContent=coins;if(coins%12===0&&mult<5){mult++;$('mult').textContent=mult}continue}if(ty==='pothole'&&rhexi.position.y>.72)continue;if(ty==='stall'&&slide>8)continue;o.userData.hit=true;hit(ty)}}}function animate(){requestAnimationFrame(animate);t+=1/60;if(playing){speed+=(Math.min(.46,.235+score/160000)-speed)*.008;score+=speed*5*mult;$('score').textContent=String(Math.floor(score)).padStart(6,'0');if(immune)immune--;const dx=target-rhexi.position.x;rhexi.position.x+=dx*.18;shadow.position.x=rhexi.position.x;const run=t*(14+speed*9);limbs.forEach(q=>q.g.rotation.x=Math.sin(run)*(.95)*(q.s*(q.leg?1:-1)));body.position.y=2.05+Math.abs(Math.sin(run))*.09;head.position.y=3.35+Math.abs(Math.sin(run))*.05;ears.forEach(q=>q.e.rotation.x=Math.sin(run+q.s)*.16);tail.rotation.y=Math.sin(run*.6)*.32;rhexi.rotation.z+=(-dx*.09-rhexi.rotation.z)*.18;if(jump){rhexi.position.y+=vy;vy-=.012;if(rhexi.position.y<=0){rhexi.position.y=0;vy=0;jump=false}}if(slide>0){slide--;rhexi.scale.y+=(.56-rhexi.scale.y)*.25}else rhexi.scale.y+=(1-rhexi.scale.y)*.2;for(const o of objs){o.position.z+=speed;if(o.userData.type==='coin')o.rotation.y+=.09;if(o.position.z>16){o.position.z-=240;o.visible=true;o.userData.hit=false}}collision()}camera.position.x+=(rhexi.position.x*.2-camera.position.x)*.08;camera.position.y+=(5.4+rhexi.position.y*.15-camera.position.y)*.08;camera.position.z=10.2;camera.lookAt(rhexi.position.x*.1,2.15,-11);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
