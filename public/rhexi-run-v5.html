<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>RHEXI RUN V6 GLB</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#58c9f5;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none;color:#fff;font-weight:900;text-shadow:0 3px 8px #0008}.top{display:flex;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 14px}.pill{background:#15284de8;border:3px solid #ffffff9c;border-radius:20px;padding:8px 13px;font-size:16px}.hint{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#20263ee8;border:3px solid #ffffff9c;border-radius:28px;padding:10px 18px;white-space:nowrap}.start{position:fixed;inset:0;z-index:4;display:grid;place-items:center;background:#07152d77}.card{width:min(88vw,410px);background:#101a32ef;border:3px solid #fff9;border-radius:28px;padding:25px;text-align:center;color:white}.card h1{font-size:40px;margin:0}.pink{color:#ff3196}.yellow{color:#ffe128}.card button{font:inherit;font-weight:1000;font-size:22px;color:white;background:#ff3196;border:0;border-radius:18px;padding:14px 32px}.hidden{display:none}.badge{position:fixed;right:12px;bottom:82px;background:#0d1e3dd9;color:#fff;border:2px solid #fff8;border-radius:14px;padding:8px 10px;font-size:11px;font-weight:800}</style></head><body><div id="start" class="start"><div class="card"><h1>RHEXI <span class="pink">RUN</span></h1><p class="yellow"><b>IGUALA · V6 GLB</b></p><p>Versión de prueba con modelo GLB integrado.</p><button id="play">JUGAR</button><p>← → carriles · ↑ salto · ↓ deslizar</p></div></div><div class="hud"><div class="top"><div class="pill">🟡 <span id="coins">0</span></div><div class="pill">SCORE <span id="score">000000</span> ×<span id="mult">1</span></div><div class="pill">❤️ <span id="lives">3</span></div></div><div class="hint">← DESLIZA · ↑ SALTA · ↓ ESQUIVA →</div></div><div class="badge" id="badge">CARGANDO RHEXI GLB…</div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x66cef5);scene.fog=new THREE.FogExp2(0x7bcfed,.011);const camera=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.1,260);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe9fbff,0x73552d,3.0));const sun=new THREE.DirectionalLight(0xffe1b0,4.2);sun.position.set(-15,25,14);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const M=(c,r=.75,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const box=(x,y,z,c,r=.75)=>{const q=new THREE.Mesh(new THREE.BoxGeometry(x,y,z),M(c,r));q.castShadow=q.receiveShadow=true;return q};const world=new THREE.Group();scene.add(world);const lanes=[-3,0,3];const road=box(12,.22,280,0x414650,.88);road.position.set(0,-.11,-128);world.add(road);for(const s of[-1,1]){const sw=box(5,.35,280,s<0?0xf7b943:0xf39c54);sw.position.set(s*8.5,.05,-128);world.add(sw)}for(let z=10;z>-255;z-=9)for(const x of[-2,2]){const ln=box(.12,.025,3.8,0xffffff);ln.position.set(x,.03,z);world.add(ln)}const cols=[0xff7c68,0x2bc5c5,0xffd85c,0x77c96b,0x9a72d4,0xf39a55,0x48a9db];for(let z=2;z>-245;z-=11){for(const s of[-1,1]){const h=5+Math.random()*7,w=4+Math.random()*2;const b=box(w,h,7.4,cols[Math.floor(Math.random()*cols.length)],.84);b.position.set(s*(10.4+Math.random()*1.2),h/2,z);world.add(b)}}function palm(x,z){const t=new THREE.Mesh(new THREE.CylinderGeometry(.13,.25,4.4,8),M(0x89562f,.9));t.position.set(x,2.2,z);world.add(t);for(let i=0;i<7;i++){const l=new THREE.Mesh(new THREE.CapsuleGeometry(.07,1.25,4,6),M(0x2b9c4c,.85));l.position.set(x+Math.cos(i*.9)*.55,4.5,z+Math.sin(i*.9)*.55);l.rotation.z=Math.PI/2;l.rotation.y=i*.9;world.add(l)}}for(let z=-8;z>-235;z-=18){palm(-7.8,z);palm(7.8,z-7)}function canvasSign(text,sub,bg='#17204a'){const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,512,256);x.textAlign='center';x.fillStyle='white';x.font='900 60px sans-serif';x.fillText(text,256,108);x.fillStyle='#ff3296';x.font='900 44px sans-serif';x.fillText(sub,256,174);return new THREE.CanvasTexture(c)}function board(x,z){const g=new THREE.Mesh(new THREE.PlaneGeometry(3.8,2),new THREE.MeshBasicMaterial({map:canvasSign('RHEVOLVER','NEWS')}));g.position.set(x,3.3,z);g.rotation.y=x<0?Math.PI/14:-Math.PI/14;world.add(g)}for(let z=-12;z>-220;z-=34){board(-7,z);board(7,z-15)}function arch(z){const l=box(1.3,6.6,1.5,0xeac79f),r=box(1.3,6.6,1.5,0xeac79f),t=box(9.4,1.5,1.7,0xeac79f);l.position.set(-4.5,3.3,z);r.position.set(4.5,3.3,z);t.position.set(0,6,z);world.add(l,r,t);const s=new THREE.Mesh(new THREE.PlaneGeometry(6.7,1.35),new THREE.MeshBasicMaterial({map:canvasSign('IGUALA','DE LA INDEPENDENCIA','#eac79f')}));s.position.set(0,6,z+1);world.add(s)}arch(-76);const rhexi=new THREE.Group();scene.add(rhexi);rhexi.position.set(0,0,2.7);let model=null;const nodes={};const loader=new GLTFLoader();loader.load('/rhexi-assets/RHEXI_ultralight.glb',g=>{model=g.scene;model.rotation.y=Math.PI;model.scale.setScalar(.9);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}if(o.name)nodes[o.name]=o});rhexi.add(model);document.getElementById('badge').textContent='RHEXI GLB ACTIVO';},undefined,e=>{document.getElementById('badge').textContent='ERROR AL CARGAR GLB';console.error(e)});const shadow=new THREE.Mesh(new THREE.CircleGeometry(1,28),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.25}));shadow.rotation.x=-Math.PI/2;shadow.position.set(0,.02,2.7);scene.add(shadow);const objs=[];function obj(type,l,z){const g=new THREE.Group();if(type==='coin'){const q=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.13,24),new THREE.MeshStandardMaterial({color:0xffd31e,emissive:0xff9d00,emissiveIntensity:.35,metalness:.7,roughness:.2}));q.rotation.z=Math.PI/2;q.position.y=1.05;g.add(q)}if(type==='pothole'){const q=new THREE.Mesh(new THREE.CylinderGeometry(.72,1.05,.08,20),M(0x111318,.95));q.scale.z=1.45;q.position.y=.03;g.add(q)}if(type==='puddle'){const q=new THREE.Mesh(new THREE.CircleGeometry(1.05,26),new THREE.MeshStandardMaterial({color:0x40caff,roughness:.1,transparent:true,opacity:.76}));q.rotation.x=-Math.PI/2;q.scale.y=.5;q.position.y=.04;g.add(q)}if(type==='stall'){const b=box(1.7,1.05,1.15,0xe96638);b.position.y=.52;g.add(b);const roof=box(2.3,.18,1.8,0xffd73c);roof.position.y=2.15;g.add(roof)}if(type==='van'){const b=box(1.9,1.8,3.2,0xe8edf2);b.position.y=.92;g.add(b)}g.position.set(lanes[l],0,z);g.userData={type,hit:false};world.add(g);objs.push(g)}for(let z=-16;z>-240;z-=6.3){const l=Math.floor(Math.random()*3),r=Math.random();obj(r<.44?'coin':r<.61?'pothole':r<.73?'puddle':r<.88?'stall':'van',l,z);if(Math.random()>.45)obj('coin',(l+1)%3,z-2.7)}let playing=false,lane=1,target=0,vy=0,jump=false,slide=0,score=0,coins=0,lives=3,mult=1,speed=.235,t=0,immune=0;const $=x=>document.getElementById(x);function move(d){if(playing){lane=Math.max(0,Math.min(2,lane+d));target=lanes[lane]}}function up(){if(playing&&!jump){jump=true;vy=.2}}function down(){if(playing&&!jump)slide=34}let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>25)move(dx>0?1:-1);else if(Math.abs(dy)>25)(dy<0?up():down())},{passive:true});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')up();if(e.key==='ArrowDown'||e.key==='s')down()});$('play').onclick=()=>{playing=true;$('start').classList.add('hidden')};function hit(type){if(immune)return;if(type==='puddle'){speed*=.72;return}lives--;immune=65;$('lives').textContent=lives;if(lives<=0){playing=false;$('start').classList.remove('hidden');$('play').textContent='REINTENTAR'}}function collision(){for(const o of objs){if(o.userData.hit||!o.visible)continue;if(Math.abs(o.position.z-rhexi.position.z)<1.05&&Math.abs(o.position.x-rhexi.position.x)<.95){const ty=o.userData.type;if(ty==='coin'){o.userData.hit=true;o.visible=false;coins++;score+=130*mult;$('coins').textContent=coins;if(coins%12===0&&mult<5){mult++;$('mult').textContent=mult}continue}if(ty==='pothole'&&rhexi.position.y>.72)continue;if(ty==='stall'&&slide>8)continue;o.userData.hit=true;hit(ty)}}}function animateModel(run){if(!model)return;const la=nodes['Leg-1'],lb=nodes['Leg1'],aa=nodes['Arm-1'],ab=nodes['Arm1'],tail=nodes['Tail'],ea=nodes['Ear-1'],eb=nodes['Ear1'];if(la)la.rotation.x=Math.sin(run)*.75;if(lb)lb.rotation.x=-Math.sin(run)*.75;if(aa)aa.rotation.x=-Math.sin(run)*.65;if(ab)ab.rotation.x=Math.sin(run)*.65;if(tail)tail.rotation.y=Math.sin(run*.5)*.35;if(ea)ea.rotation.x=Math.sin(run+1)*.1;if(eb)eb.rotation.x=Math.sin(run-1)*.1;model.position.y=Math.abs(Math.sin(run))*0.07;if(slide>0){model.scale.y+=(.62-model.scale.y)*.24}else model.scale.y+=(.9-model.scale.y)*.2}function animate(){requestAnimationFrame(animate);t+=1/60;if(playing){speed+=(Math.min(.46,.235+score/160000)-speed)*.008;score+=speed*5*mult;$('score').textContent=String(Math.floor(score)).padStart(6,'0');if(immune)immune--;const dx=target-rhexi.position.x;rhexi.position.x+=dx*.18;shadow.position.x=rhexi.position.x;const run=t*(14+speed*9);animateModel(run);rhexi.rotation.z+=(-dx*.09-rhexi.rotation.z)*.18;if(jump){rhexi.position.y+=vy;vy-=.012;if(rhexi.position.y<=0){rhexi.position.y=0;vy=0;jump=false}}if(slide>0)slide--;for(const o of objs){o.position.z+=speed;if(o.userData.type==='coin')o.rotation.y+=.09;if(o.position.z>16){o.position.z-=240;o.visible=true;o.userData.hit=false}}collision()}camera.position.x+=(rhexi.position.x*.2-camera.position.x)*.08;camera.position.y+=(5.4+rhexi.position.y*.15-camera.position.y)*.08;camera.position.z=10.2;camera.lookAt(rhexi.position.x*.1,2.15,-11);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
