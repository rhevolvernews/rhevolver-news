<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>RHEXI 3D — Corre por Iguala</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#72d9ff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 5px #0008}.top{display:flex;justify-content:space-between;gap:8px;padding:max(12px,env(safe-area-inset-top)) 14px 0}.pill{background:#15172bd9;border:2px solid #fff5;border-radius:18px;padding:8px 12px;font-weight:900;box-shadow:0 5px 15px #0003}.brand{position:fixed;left:50%;top:max(62px,calc(env(safe-area-inset-top) + 48px));transform:translateX(-50%);font-weight:1000;font-size:18px;white-space:nowrap}.brand b{color:#ffe500}.tip{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#15172bcc;border-radius:20px;padding:9px 14px;font-size:12px;font-weight:800;white-space:nowrap;transition:.4s}.toast{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%) scale(.8);background:#ff2f92e8;border:3px solid white;color:white;border-radius:22px;padding:12px 20px;font-size:20px;font-weight:1000;opacity:0;transition:.18s;pointer-events:none;text-align:center}.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}.start{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#25bdf355,#5be76922);z-index:3}.card{width:min(88vw,420px);background:#171a31e8;border:3px solid #fff8;border-radius:30px;padding:24px;text-align:center;color:white;box-shadow:0 20px 60px #0005}.card h1{margin:0;font-size:34px;line-height:.95}.card h1 span{color:#ffe500}.card p{font-weight:700;opacity:.9}.card button{border:0;border-radius:20px;padding:14px 28px;background:#ff2f92;color:#fff;font-size:19px;font-weight:1000;box-shadow:0 7px 0 #a5125b}.small{font-size:11px!important;opacity:.7}.hidden{display:none}
</style></head><body><div id="start" class="start"><div class="card"><h1>RHEXI<br><span>CORRE POR IGUALA</span></h1><p>Prototipo 3D · movimiento animado · obstáculos urbanos</p><button id="play">JUGAR</button><p class="small">Desliza: izquierda/derecha · arriba: saltar · abajo: agacharse</p></div></div><div class="hud"><div class="top"><div class="pill">🏆 <span id="score">0</span></div><div class="pill">❤️ <span id="lives">3</span></div><div class="pill">🌰 <span id="tams">0</span></div></div><div class="brand">RHEVOLVER <b>MEDIA</b> · IGUALA</div><div id="tip" class="tip">DESLIZA PARA MOVER A RHEXI</div></div><div id="toast" class="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x67d7ff);scene.fog=new THREE.Fog(0x67d7ff,45,155);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,250);camera.position.set(0,5.7,9.2);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9f8ff,0x5b7b35,2.3));const sun=new THREE.DirectionalLight(0xfff0cc,3);sun.position.set(-15,28,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=25;sun.shadow.camera.bottom=-10;scene.add(sun);
const mat=(c,rough=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:rough});const box=(x,y,z,c)=>{let m=new THREE.Mesh(new THREE.BoxGeometry(x,y,z),mat(c));m.castShadow=m.receiveShadow=true;return m};
// world
const road=box(13,.18,240,0x41475a);road.position.set(0,-.12,-100);road.receiveShadow=true;scene.add(road);for(let side of [-1,1]){let walk=box(4,.35,240,side<0?0xffcc65:0xf49a65);walk.position.set(side*8.5,.02,-100);scene.add(walk)}
for(let z=5;z>-210;z-=12){for(let x of [-2.15,2.15]){let stripe=box(.13,.025,4.5,0xffffff);stripe.position.set(x,.02,z);scene.add(stripe)}}
// mountains
const mountain=new THREE.Mesh(new THREE.ConeGeometry(30,24,5),mat(0x4aaa67));mountain.position.set(-25,10,-135);scene.add(mountain);const hill=new THREE.Mesh(new THREE.ConeGeometry(25,18,6),mat(0x54bd72));hill.position.set(24,7,-150);scene.add(hill);
// buildings colorful
const colors=[0xff6b78,0x55c8ff,0xffd447,0x75df87,0xb889ff,0xff914d];for(let z=2;z>-190;z-=14){for(let s of [-1,1]){let h=4+Math.random()*7,b=box(5,h,8,colors[Math.floor(Math.random()*colors.length)]);b.position.set(s*(11+Math.random()*2),h/2,z);scene.add(b);let aw=box(5.2,.35,1.5,0xff2f92);aw.position.set(b.position.x,1.8,z+4.2);scene.add(aw)}}
// traffic lights broken
function light(z,s){const g=new THREE.Group(),pole=box(.22,5,.22,0x333333);pole.position.y=2.5;g.add(pole);const head=box(1,2.6,.7,0x222222);head.position.set(s*.45,4.5,0);g.add(head);[0xff2638,0xffd11a,0x3ee26b].forEach((c,i)=>{let l=new THREE.Mesh(new THREE.SphereGeometry(.25,12,8),mat(c));l.position.set(s*.45,5.25-i*.75,.38);l.userData.blink=Math.random()>.45;g.add(l)});g.position.set(s*5.6,0,z);scene.add(g)}for(let z=-18;z>-190;z-=42){light(z,-1);light(z,1)}
// Rhexi procedural 3D
const rhexi=new THREE.Group();scene.add(rhexi);rhexi.position.set(0,0,2.5);const orange=mat(0xe87824),dark=mat(0x9b4e1d),black=mat(0x101018),white=mat(0xf8e3c7);
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.72,1.15,6,12),orange);torso.position.y=2.05;torso.castShadow=true;rhexi.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.88,18,14),orange);head.scale.set(1,1,.9);head.position.set(0,3.35,0);head.castShadow=true;rhexi.add(head);const muzzle=new THREE.Mesh(new THREE.SphereGeometry(.5,14,10),white);muzzle.scale.set(1.2,.72,.75);muzzle.position.set(0,3.18,.72);rhexi.add(muzzle);const nose=new THREE.Mesh(new THREE.SphereGeometry(.28,14,10),black);nose.scale.set(1.15,.8,.8);nose.position.set(0,3.32,1.05);rhexi.add(nose);
for(let s of [-1,1]){let ear=new THREE.Mesh(new THREE.CapsuleGeometry(.23,.75,5,8),dark);ear.position.set(s*.78,3.35,-.05);ear.rotation.z=s*.35;rhexi.add(ear);ear.userData.ear=s;let lens=box(.68,.35,.12,0x090912);lens.position.set(s*.36,3.63,.78);rhexi.add(lens)}let bridge=box(.25,.08,.1,0x090912);bridge.position.set(0,3.63,.78);rhexi.add(bridge);
const band=box(1.35,.25,.22,0x111111);band.position.set(0,2.78,.65);band.rotation.x=-.15;rhexi.add(band);
const limbs=[];for(let s of [-1,1]){let arm=new THREE.Group();let am=new THREE.Mesh(new THREE.CapsuleGeometry(.19,.9,5,8),orange);am.position.y=-.55;arm.add(am);arm.position.set(s*.78,2.45,0);rhexi.add(arm);limbs.push({o:arm,s,type:'arm'});let leg=new THREE.Group();let lm=new THREE.Mesh(new THREE.CapsuleGeometry(.25,.85,5,8),dark);lm.position.y=-.55;leg.add(lm);leg.position.set(s*.42,1.28,0);rhexi.add(leg);limbs.push({o:leg,s,type:'leg'})}
// chase officer
const cop=new THREE.Group();const cb=box(1.2,1.7,.7,0x273d69);cb.position.y=1.35;cop.add(cb);const ch=new THREE.Mesh(new THREE.SphereGeometry(.48,12,10),mat(0xd89b72));ch.position.y=2.55;cop.add(ch);let cap=box(1,.2,.75,0x15254a);cap.position.set(0,2.9,0);cop.add(cap);cop.position.set(0,0,7.1);scene.add(cop);
const objects=[];function addObj(type,lane,z){let o;if(type==='pothole'){o=new THREE.Mesh(new THREE.CylinderGeometry(.8,1.05,.12,18),mat(0x17181d));o.scale.z=1.5;o.position.y=.02}else if(type==='stall'){o=new THREE.Group();let table=box(1.8,1.1,1.2,0xf06a38);table.position.y=.55;o.add(table);let roof=box(2.4,.18,1.8,0xffe04b);roof.position.y=2.25;o.add(roof);for(let x of [-.85,.85]){let p=box(.08,1.3,.08,0x555555);p.position.set(x,1.6,0);o.add(p)}}else if(type==='puddle'){o=new THREE.Mesh(new THREE.CircleGeometry(1.15,18),new THREE.MeshStandardMaterial({color:0x4ecfff,roughness:.25,metalness:.1}));o.rotation.x=-Math.PI/2;o.scale.y=.6;o.position.y=.04}else{ // tamarind
 o=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.55,5,8),mat(0x9b5427));o.rotation.z=Math.PI/2;o.position.y=1.1;o.userData.collect=true}
o.position.x=lane*2.8;o.position.z=z;o.userData.type=type;o.userData.hit=false;scene.add(o);objects.push(o)}
function spawnSet(z){let lane=Math.floor(Math.random()*3)-1;let r=Math.random();addObj(r<.28?'pothole':r<.52?'stall':r<.68?'puddle':'tamarind',lane,z);if(Math.random()>.45)addObj('tamarind',lane===1?0:lane+1,z-3)}for(let z=-12;z>-180;z-=7)spawnSet(z);
let playing=false,lane=0,targetX=0,vy=0,jumping=false,sliding=0,score=0,lives=3,tams=0,speed=.23,time=0,chase=0;const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),850)}
function move(d){if(!playing)return;lane=Math.max(-1,Math.min(1,lane+d));targetX=lane*2.8}function jump(){if(!playing||jumping)return;jumping=true;vy=.18}function slide(){if(!playing||jumping)return;sliding=38}
let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>28)move(dx>0?1:-1);else if(Math.abs(dy)>28)(dy<0?jump:slide)()},{passive:true});addEventListener('keydown',e=>{if(['ArrowLeft','a'].includes(e.key))move(-1);if(['ArrowRight','d'].includes(e.key))move(1);if(['ArrowUp','w',' '].includes(e.key))jump();if(['ArrowDown','s'].includes(e.key))slide()});
$('play').onclick=()=>{$('start').classList.add('hidden');playing=true;$('tip').style.opacity=1;setTimeout(()=>$('tip').style.opacity=0,3500)};
function collide(){for(let o of objects){if(o.userData.hit)continue;let dz=Math.abs(o.position.z-rhexi.position.z);if(dz<1.05&&Math.abs(o.position.x-rhexi.position.x)<1){if(o.userData.type==='tamarind'){o.userData.hit=true;o.visible=false;tams++;score+=100;$('tams').textContent=tams;continue}if(o.userData.type==='pothole'&&rhexi.position.y>.75)continue;o.userData.hit=true;if(o.userData.type==='puddle'){speed=.14;chase+=.18;toast('💦 ¡CHARCO!')}else{lives--;chase+=.32;toast(o.userData.type==='stall'?'🛒 ¡PUESTO!':'🕳️ ¡BACHE!');$('lives').textContent=lives;if(lives<=0){playing=false;$('start').classList.remove('hidden');$('play').textContent='REINTENTAR';score=0;lives=3;tams=0;chase=0;$('lives').textContent=3;$('tams').textContent=0}}}}}
function animate(){requestAnimationFrame(animate);let dt=1/60;time+=dt;if(playing){speed+=(0.235-speed)*.015;score+=speed*3;$('score').textContent=Math.floor(score);rhexi.position.x+=(targetX-rhexi.position.x)*.16;let run=time*12;limbs.forEach(l=>{let phase=l.s*(l.type==='leg'?1:-1);l.o.rotation.x=Math.sin(run)*.72*phase});rhexi.rotation.z+=( -(targetX-rhexi.position.x)*.09-rhexi.rotation.z)*.12;torso.position.y=2.05+Math.abs(Math.sin(run))*0.07;head.rotation.z=Math.sin(run*.5)*.025;rhexi.children.forEach(c=>{if(c.userData.ear)c.rotation.x=Math.sin(run+c.userData.ear)*.12});if(jumping){rhexi.position.y+=vy;vy-=.011;if(rhexi.position.y<=0){rhexi.position.y=0;jumping=false;vy=0}}if(sliding>0){sliding--;rhexi.scale.y+=(.62-rhexi.scale.y)*.25}else rhexi.scale.y+=(1-rhexi.scale.y)*.18;for(let o of objects){o.position.z+=speed;if(o.userData.collect)o.rotation.y+=.07;if(o.position.z>14){o.position.z-=195;o.visible=true;o.userData.hit=false}}collide();chase=Math.max(0,chase-.0015);cop.position.x+=(rhexi.position.x-cop.position.x)*.05;cop.position.z=7.1-chase*4;cop.position.y=Math.abs(Math.sin(run+.8))*.08;camera.position.x+=(rhexi.position.x*.22-camera.position.x)*.05;camera.position.y=5.7+rhexi.position.y*.22;camera.lookAt(rhexi.position.x*.25,2,-8);}
// broken lights blink
scene.traverse(o=>{if(o.userData.blink&&Math.random()<.012)o.visible=!o.visible});renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
