<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07111e"><title>RHEXI: Corre por Iguala</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#07111e;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}#wrap{height:100dvh;display:grid;place-items:center;padding:8px}#g{height:min(100dvh - 16px,900px);width:auto;max-width:100%;aspect-ratio:9/16;border-radius:24px;box-shadow:0 20px 60px #0008;background:#7dd3fc}.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#07111edb}.box{width:min(430px,92vw);text-align:center}.logo{font-size:44px;font-weight:1000;background:linear-gradient(90deg,#ff3d81,#ffd33d);-webkit-background-clip:text;color:transparent}.sub{font-size:14px;color:#dbeafe}.btn{width:100%;padding:16px;margin-top:16px;border:0;border-radius:16px;background:#ffd33d;color:#111827;font-weight:1000;font-size:20px}.small{font-size:12px;color:#94a3b8}.hide{display:none}.hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(94vw,500px);display:flex;justify-content:space-between;gap:6px;pointer-events:none}.pill{background:#07111ed9;border:1px solid #ffffff33;border-radius:999px;padding:7px 10px;font-weight:900;font-size:13px}.toast{position:fixed;top:16%;left:50%;transform:translateX(-50%);background:#07111ee8;border:1px solid #fff3;padding:12px 16px;border-radius:15px;font-weight:900;max-width:84vw;text-align:center}.chars{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.char{padding:13px;border-radius:16px;background:#ffffff12;border:1px solid #ffffff25}.lock{opacity:.5}</style></head><body><div id="wrap"><canvas id="g" width="900" height="1600"></canvas></div><div class="hud hide" id="hud"><div class="pill">⭐ <span id="sc">0</span></div><div class="pill">❤️ <span id="lv">3</span></div><div class="pill">🌰 <span id="ta">0</span></div><div class="pill">🏍️ <span id="mo">—</span></div></div><div class="ov" id="menu"><div class="box"><div class="logo">RHEXI</div><h1>Corre por Iguala</h1><p class="sub">Baches, drenajes, tamarindos, pozole, moto y tránsito.</p><p>📍 IGUALA, GUERRERO</p><button class="btn" id="play">JUGAR</button><button class="btn" id="personajes" style="background:#ffffff18;color:white;font-size:15px">PERSONAJES</button><p class="small">Desliza izquierda/derecha · arriba para saltar · abajo para agacharte</p></div></div><div class="ov hide" id="chars"><div class="box"><h2>Personajes</h2><div class="chars"><div class="char">🐶<br><b>RHEXI</b><br><small>Disponible</small></div><div class="char lock">🔒<br><b>INVITADO 1</b><br><small>Misión 1</small></div><div class="char lock">🔒<br><b>INVITADO 2</b><br><small>Misión 2</small></div><div class="char lock">🔒<br><b>INVITADO 3</b><br><small>Misión 3</small></div></div><button class="btn" id="volver">VOLVER</button></div></div><div class="toast hide" id="toast"></div><script>const c=document.getElementById('g'),x=c.getContext('2d'),W=900,H=1600,L=[250,450,650];let run=0,score=0,lives=3,tam=0,lane=1,px=450,py=1260,vy=0,jump=0,slide=0,speed=14,ents=[],spawn=0,moto=0,shield=0,pursuit=.18,last=0;const $=i=>document.getElementById(i),hud=$('hud'),menu=$('menu'),toast=$('toast');function msg(s){toast.textContent=s;toast.classList.remove('hide');clearTimeout(msg.t);msg.t=setTimeout(()=>toast.classList.add('hide'),1400)}function start(){score=0;lives=3;tam=0;lane=1;px=L[1];py=1260;vy=0;jump=slide=0;speed=14;ents=[];spawn=0;moto=shield=0;pursuit=.18;run=1;menu.classList.add('hide');hud.classList.remove('hide');msg('¡CORRE, RHEXI!')}function act(a){if(!run)return;if(a==='l')lane=Math.max(0,lane-1);if(a==='r')lane=Math.min(2,lane+1);if(a==='u'&&!jump){vy=-27;jump=1}if(a==='d')slide=35}let sx=0,sy=0;c.addEventListener('touchstart',e=>{let t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});c.addEventListener('touchend',e=>{let t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>Math.abs(dy))act(dx>25?'r':dx<-25?'l':'');else act(dy<-25?'u':dy>25?'d':'')},{passive:true});addEventListener('keydown',e=>act(({ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'u',w:'u',' ':'u',ArrowDown:'d',s:'d'})[e.key]||''));function add(type,l=Math.floor(Math.random()*3)){ents.push({type,l,z:0,hit:0})}function make(){let r=Math.random();if(r<.2)add('bache');else if(r<.34)add('charco');else if(r<.43)add('dren');else if(r<.5)add('barrera');else if(r<.73)add('tamarindo');else if(r<.82)add('pozole');else if(r<.9)add('caja');else if(moto>0)add('casco');else add('tamarindo')}function proj(e){let t=e.z/1350,s=.18+.9*t,y=560+t*900,xx=450+(L[e.l]-450)*(.35+.65*t);return{xx,y,s}}function hit(e,p){if(e.hit||p.y<1120||p.y>1370||e.l!==lane)return;let high=py<1150;if(['tamarindo','pozole','caja','casco'].includes(e.type)){e.hit=1;if(e.type==='tamarindo'){tam++;score+=35}if(e.type==='pozole')score+=120;if(e.type==='casco'){score+=90;moto=Math.min(1100,moto+120);msg('⛑️ Casco: moto prolongada')}if(e.type==='caja'){let r=Math.random();if(r<.55){moto=900;msg('🏍️ ¡MOTO! Recoge cascos')}else if(r<.8){shield=500;msg('🛡️ Protección')}else{score+=500;msg('⚡ +500 puntos')}}return}if(e.type==='bache'||e.type==='dren'){if(high){e.hit=1;score+=50}else if(moto>0){moto=0;e.hit=1;pursuit+=.22;msg('🕳️ La moto cayó: la perdiste')}else if(shield>0){e.hit=1}else{e.hit=1;lives--;pursuit=.2;shield=100;msg('🕳️ ¡Al drenaje! Pierdes una vida');if(lives<=0)end()}}else{if((e.type==='barrera'&&slide>0)||high){e.hit=1;score+=30}else{e.hit=1;pursuit+=.18;speed=Math.max(10,speed-1.2);msg(e.type==='charco'?'💦 Agua estancada: vas más lento':'🚧 Te frenaste; tránsito se acerca')}}}function end(){run=0;hud.classList.add('hide');setTimeout(()=>{menu.classList.remove('hide');$('play').textContent='VOLVER A JUGAR'},500)}function update(){px+=(L[lane]-px)*.22;if(jump){vy+=1.45;py+=vy;if(py>=1260){py=1260;vy=0;jump=0}}if(slide>0)slide--;if(moto>0)moto--;if(shield>0)shield--;score+=speed*.07;speed=Math.min(23,speed+.002);spawn-=speed;if(spawn<=0){make();spawn=145+Math.random()*95}for(let e of ents){e.z+=speed;let p=proj(e);hit(e,p)}ents=ents.filter(e=>e.z<1500&&!e.hit);pursuit=Math.max(.08,pursuit-.0015);if(pursuit>.88){let loss=Math.min(Math.floor(score*.28),650);score=Math.max(0,score-loss);let had=moto>0;moto=0;pursuit=.25;shield=100;msg(had?'🚨 Mordida: -'+loss+' puntos. La grúa se llevó la moto.':'🚨 Tránsito te alcanzó: mordida -'+loss+' puntos.')}$('sc').textContent=Math.floor(score);$('lv').textContent=lives;$('ta').textContent=tam;$('mo').textContent=moto?Math.ceil(moto/60)+'s':'—'}function world(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#4cc9f0');g.addColorStop(.35,'#c7f9ff');g.addColorStop(.36,'#70c05b');g.addColorStop(1,'#494b50');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#477f42';x.beginPath();x.moveTo(0,550);x.lineTo(140,410);x.lineTo(250,480);x.lineTo(390,300);x.lineTo(520,480);x.lineTo(650,350);x.lineTo(900,550);x.closePath();x.fill();x.strokeStyle='#eee';x.lineWidth=7;x.beginPath();x.moveTo(650,360);x.lineTo(650,175);x.stroke();x.fillStyle='#178d51';x.fillRect(650,175,55,20);x.fillStyle='white';x.fillRect(705,175,55,20);x.fillStyle='#d32f2f';x.fillRect(760,175,55,20);x.fillStyle='#fff';x.font='900 50px system-ui';x.textAlign='center';x.fillText('IGUALA',450,545);let cols=['#ff6b6b','#ffd166','#8b5cf6','#2dd4bf','#f472b6'];for(let i=0;i<7;i++){x.fillStyle=cols[i%5];x.fillRect(i*145-45,485+(i%2)*20,115,120)}x.fillStyle='#4a4d53';x.beginPath();x.moveTo(300,540);x.lineTo(600,540);x.lineTo(880,H);x.lineTo(20,H);x.closePath();x.fill();x.strokeStyle='#ffffffaa';x.lineWidth=7;x.setLineDash([35,30]);for(let i=1;i<3;i++){x.beginPath();x.moveTo(300+i*100,540);x.lineTo(20+i*286,H);x.stroke()}x.setLineDash([]);x.fillStyle='white';x.font='800 22px system-ui';x.fillText('RHEVOLVER.NEWS',145,625)}function drawEnt(){for(let e of ents){let p=proj(e);x.save();x.translate(p.xx,p.y);x.scale(p.s,p.s);x.textAlign='center';if(e.type==='bache'){x.fillStyle='#111';x.beginPath();x.ellipse(0,15,72,30,0,0,7);x.fill()}else if(e.type==='charco'){x.fillStyle='#48a8dbaa';x.beginPath();x.ellipse(0,15,75,26,0,0,7);x.fill()}else if(e.type==='dren'){x.fillStyle='#111';x.beginPath();x.arc(0,15,48,0,7);x.fill();x.strokeStyle='#888';x.lineWidth=8;x.stroke()}else if(e.type==='barrera'){x.fillStyle='#ff7b00';x.fillRect(-65,-12,130,35);x.fillStyle='white';for(let i=-50;i<60;i+=38)x.fillRect(i,-12,18,35)}else{x.font='80px system-ui';x.fillText({tamarindo:'🌰',pozole:'🍲',caja:'🎁',casco:'⛑️'}[e.type],0,0)}x.restore()}}function player(){x.save();x.translate(px,py);if(moto>0){x.fillStyle='#20242a';x.beginPath();x.arc(-42,48,32,0,7);x.arc(48,48,32,0,7);x.fill();x.fillStyle='#ff3d81';x.fillRect(-35,7,88,24)}x.translate(0,moto?-35:0);x.fillStyle='#df7d36';x.beginPath();x.ellipse(0,0,64,72,0,0,7);x.fill();x.fillStyle='#a95428';x.beginPath();x.ellipse(-57,-16,24,52,-.2,0,7);x.ellipse(57,-16,24,52,.2,0,7);x.fill();x.fillStyle='#f1a260';x.beginPath();x.ellipse(0,22,44,31,0,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(0,6,17,0,7);x.fill();x.fillRect(-58,-34,47,22);x.fillRect(11,-34,47,22);x.fillRect(-11,-27,22,6);x.fillStyle='#111827';x.beginPath();x.moveTo(-54,61);x.lineTo(54,61);x.lineTo(34,94);x.lineTo(-34,94);x.closePath();x.fill();x.fillStyle='white';x.font='900 17px system-ui';x.fillText('RHEXI',0,82);if(shield>0){x.strokeStyle='#36d7ff';x.lineWidth=8;x.beginPath();x.arc(0,0,90,0,7);x.stroke()}x.restore()}function transit(){if(!run)return;x.save();x.translate(115,1510-pursuit*250);x.font='90px system-ui';x.fillText('🚓',0,0);x.fillStyle='white';x.font='900 18px system-ui';x.fillText('TRÁNSITO',55,45);x.restore();x.fillStyle='#07111eaa';x.fillRect(45,85,220,22);x.fillStyle=pursuit>.7?'#ff3d56':'#ffd33d';x.fillRect(45,85,220*pursuit,22);x.strokeStyle='white';x.strokeRect(45,85,220,22)}function loop(t){let dt=Math.min(2,(t-last)/16.7||1);last=t;if(run)for(let i=0;i<Math.round(dt)||i<1;i++)update();world();if(run)drawEnt();player();transit();requestAnimationFrame(loop)}$('play').onclick=start;$('personajes').onclick=()=>{$('chars').classList.remove('hide');menu.classList.add('hide')};$('volver').onclick=()=>{$('chars').classList.add('hide');menu.classList.remove('hide')};requestAnimationFrame(loop)</script></body></html>
