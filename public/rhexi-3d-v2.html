<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>RHEXI 3D v2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#67d7ff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 5px #0008}.top{display:flex;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 14px}.pill{background:#171a31d9;border:2px solid #fff5;border-radius:18px;padding:8px 12px;font-weight:900}.brand{position:fixed;top:max(62px,calc(env(safe-area-inset-top) + 48px));left:50%;transform:translateX(-50%);font-weight:1000}.brand b{color:#ffe500}.start{position:fixed;inset:0;z-index:4;display:grid;place-items:center;background:linear-gradient(#25bdf355,#5be76922)}.card{width:min(88vw,420px);background:#171a31ec;border:3px solid #fff8;border-radius:30px;padding:24px;text-align:center;color:#fff;box-shadow:0 20px 60px #0005}.card h1{font-size:35px;line-height:.95;margin:0}.card h1 span{color:#ffe500}.card button{border:0;border-radius:20px;padding:14px 30px;background:#ff2f92;color:#fff;font-size:20px;font-weight:1000;box-shadow:0 7px 0 #a5125b}.small{font-size:12px;opacity:.75}.hidden{display:none}.toast{position:fixed;top:27%;left:50%;transform:translate(-50%,-50%) scale(.8);background:#ff2f92e8;border:3px solid #fff;border-radius:22px;padding:12px 18px;font-weight:1000;font-size:19px;opacity:0;transition:.15s}.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}</style></head><body><div id="start" class="start"><div class="card"><h1>RHEXI<br><span>CORRE POR IGUALA</span></h1><p>Prueba 3D v2 · cámara trasera · carrera animada</p><button id="play">JUGAR</button><p class="small">Desliza ← → · arriba salta · abajo se agacha</p></div></div><div class="hud"><div class="top"><div class="pill">🏆 <span id="score">0</span></div><div class="pill">❤️ <span id="lives">3</span></div><div class="pill">🌰 <span id="tams">0</span></div></div><div class="brand">RHEVOLVER <b>MEDIA</b> · IGUALA</div><div id="toast" class="toast"></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x65d7ff);scene.fog=new THREE.Fog(0x65d7ff,50,170);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,260);camera.position.set(0,5.2,10.8);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe9fbff,0x567b39,2.4));const sun=new THREE.DirectionalLight(0xfff1cf,3.2);sun.position.set(-14,25,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const mat=(c,r=.78)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const box=(x,y,z,c)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(x,y,z),mat(c));m.castShadow=m.receiveShadow=true;return m};
const road=box(13,.18,260,0x444957);road.position.set(0,-.12,-110);scene.add(road);for(const s of [-1,1]){const w=box(4,.34,260,s<0?0xffc85c:0xffa05c);w.position.set(s*8.5,.02,-110);scene.add(w)}for(let z=8;z>-225;z-=11)for(const x of [-2.15,2.15]){const q=box(.12,.025,4,0xffffff);q.position.set(x,.02,z);scene.add(q)}
const colors=[0xff6678,0x4fc7ff,0xffd447,0x72df86,0xb889ff,0xff914d];for(let z=2;z>-205;z-=14)for(const s of [-1,1]){const h=4+Math.random()*7,b=box(5,h,8,colors[Math.floor(Math.random()*colors.length)]);b.position.set(s*(11+Math.random()*2),h/2,z);scene.add(b);const aw=box(5.2,.32,1.5,Math.random()>.5?0xff2f92:0x00c6b8);aw.position.set(b.position.x,1.8,z+4.15);scene.add(aw)}const mountain=new THREE.Mesh(new THREE.ConeGeometry(32,25,6),mat(0x49a967));mountain.position.set(-26,10,-145);scene.add(mountain);
function light(z,s){const g=new THREE.Group(),p=box(.2,5,.2,0x333333);p.position.y=2.5;g.add(p);const h=box(1,2.5,.7,0x222222);h.position.set(s*.45,4.45,0);g.add(h);[0xff2638,0xffd11a,0x3ee26b].forEach((c,i)=>{const l=new THREE.Mesh(new THREE.SphereGeometry(.25,12,8),mat(c));l.position.set(s*.45,5.2-i*.73,.38);l.userData.blink=i===Math.floor(Math.random()*3);g.add(l)});g.position.set(s*5.6,0,z);scene.add(g)}for(let z=-18;z>-200;z-=40){light(z,-1);light(z,1)}
// RHEXI: reconstruccion 3D fiel a la referencia oficial. El personaje mira hacia -Z; la camara ve su espalda.
const rhexi=new THREE.Group();rhexi.position.set(0,0,2.5);scene.add(rhexi);const fur=mat(0xd66d22,.98),fur2=mat(0x8f451e,.98),cream=mat(0xeab57c,.98),black=mat(0x090a0c,.3),bandMat=mat(0x111114,.9);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.78,1.18,8,16),fur);torso.position.y=2.05;torso.castShadow=true;rhexi.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.93,22,18),fur);head.scale.set(1,1,.9);head.position.set(0,3.38,-.08);head.castShadow=true;rhexi.add(head);const muzzle=new THREE.Mesh(new THREE.SphereGeometry(.5,16,12),cream);muzzle.scale.set(1.25,.72,.78);muzzle.position.set(0,3.18,-.78);rhexi.add(muzzle);const nose=new THREE.Mesh(new THREE.SphereGeometry(.3,16,12),black);nose.scale.set(1.18,.85,.85);nose.position.set(0,3.32,-1.1);rhexi.add(nose);const ears=[];for(const s of [-1,1]){const ear=new THREE.Mesh(new THREE.CapsuleGeometry(.27,.82,7,10),fur2);ear.position.set(s*.82,3.34,.02);ear.rotation.z=s*.3;ear.rotation.x=-.08;rhexi.add(ear);ears.push({ear,s});const lens=box(.7,.36,.12,0x08090b);lens.position.set(s*.37,3.62,-.8);rhexi.add(lens)}const bridge=box(.25,.08,.1,0x08090b);bridge.position.set(0,3.62,-.8);rhexi.add(bridge);const band=new THREE.Mesh(new THREE.ConeGeometry(.82,.85,4),bandMat);band.rotation.y=Math.PI/4;band.position.set(0,2.67,.22);rhexi.add(band);for(let i=0;i<8;i++){const dot=new THREE.Mesh(new THREE.SphereGeometry(.035,6,5),mat(0xffffff));dot.position.set((i%4-.15*6)*.16,2.66+.1*Math.floor(i/4),.78);rhexi.add(dot)}
const limbs=[];for(const s of [-1,1]){const arm=new THREE.Group(),a=new THREE.Mesh(new THREE.CapsuleGeometry(.21,.92,6,10),fur);a.position.y=-.56;arm.add(a);arm.position.set(s*.8,2.48,0);rhexi.add(arm);limbs.push({o:arm,s,type:'arm'});const leg=new THREE.Group(),l=new THREE.Mesh(new THREE.CapsuleGeometry(.27,.92,6,10),fur2);l.position.y=-.57;leg.add(l);const foot=new THREE.Mesh(new THREE.SphereGeometry(.34,12,8),fur2);foot.scale.set(.85,.55,1.25);foot.position.set(0,-1.13,-.14);leg.add(foot);leg.position.set(s*.43,1.3,0);rhexi.add(leg);limbs.push({o:leg,s,type:'leg'})}const tail=new THREE.Mesh(new THREE.CapsuleGeometry(.15,.55,5,8),fur2);tail.position.set(.62,1.85,.65);tail.rotation.z=-.7;tail.rotation.x=.4;rhexi.add(tail);
const cop=new THREE.Group(),cb=box(1.15,1.7,.7,0x284273);cb.position.y=1.35;cop.add(cb);const ch=new THREE.Mesh(new THREE.SphereGeometry(.47,12,10),mat(0xd89b72));ch.position.y=2.55;cop.add(ch);cop.position.set(0,0,7.5);scene.add(cop);
const objects=[];function add(type,lane,z){let o;if(type==='pothole'){o=new THREE.Mesh(new THREE.CylinderGeometry(.82,1.08,.12,18),mat(0x15171c));o.scale.z=1.5;o.position.y=.02}else if(type==='stall'){o=new THREE.Group();const t=box(1.8,1.05,1.2,0xf06a38);t.position.y=.53;o.add(t);const roof=box(2.45,.18,1.8,0xffe04b);roof.position.y=2.25;o.add(roof);for(const x of [-.85,.85]){const p=box(.08,1.35,.08,0x555555);p.position.set(x,1.6,0);o.add(p)}}else if(type==='puddle'){o=new THREE.Mesh(new THREE.CircleGeometry(1.18,20),new THREE.MeshStandardMaterial({color:0x40cfff,roughness:.25}));o.rotation.x=-Math.PI/2;o.scale.y=.58;o.position.y=.04}else{o=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.55,5,8),mat(0x8d4a22));o.rotation.z=Math.PI/2;o.position.y=1.05;o.userData.collect=true}o.position.x=lane*2.8;o.position.z=z;o.userData.type=type;o.userData.hit=false;scene.add(o);objects.push(o)}function spawn(z){const lane=Math.floor(Math.random()*3)-1,r=Math.random();add(r<.3?'pothole':r<.53?'stall':r<.69?'puddle':'tamarind',lane,z);if(Math.random()>.45)add('tamarind',lane===1?0:lane+1,z-3)}for(let z=-12;z>-195;z-=7)spawn(z);
let playing=false,lane=0,targetX=0,vy=0,jumping=false,sliding=0,score=0,lives=3,tams=0,speed=.235,time=0,chase=0;const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),800)}function move(d){if(!playing)return;lane=Math.max(-1,Math.min(1,lane+d));targetX=lane*2.8}function jump(){if(playing&&!jumping){jumping=true;vy=.19}}function slide(){if(playing&&!jumping)sliding=38}let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>28)move(dx>0?1:-1);else if(Math.abs(dy)>28)(dy<0?jump:slide)()},{passive:true});addEventListener('keydown',e=>{if(['ArrowLeft','a'].includes(e.key))move(-1);if(['ArrowRight','d'].includes(e.key))move(1);if(['ArrowUp','w',' '].includes(e.key))jump();if(['ArrowDown','s'].includes(e.key))slide()});$('play').onclick=()=>{$('start').classList.add('hidden');playing=true};
function collide(){for(const o of objects){if(o.userData.hit)continue;if(Math.abs(o.position.z-rhexi.position.z)<1.05&&Math.abs(o.position.x-rhexi.position.x)<1){if(o.userData.type==='tamarind'){o.userData.hit=true;o.visible=false;tams++;score+=100;$('tams').textContent=tams;continue}if(o.userData.type==='pothole'&&rhexi.position.y>.75)continue;o.userData.hit=true;if(o.userData.type==='puddle'){speed=.15;chase+=.15;toast('💦 ¡CHARCO!')}else{lives--;chase+=.3;toast(o.userData.type==='stall'?'🛒 ¡PUESTO!':'🕳️ ¡BACHE!');$('lives').textContent=lives;if(lives<=0){playing=false;$('start').classList.remove('hidden');$('play').textContent='REINTENTAR';score=0;lives=3;tams=0;chase=0;$('lives').textContent=3;$('tams').textContent=0}}}}}
function animate(){requestAnimationFrame(animate);time+=1/60;if(playing){speed+=(.245-speed)*.012;score+=speed*3;$('score').textContent=Math.floor(score);const dx=targetX-rhexi.position.x;rhexi.position.x+=dx*.18;const run=time*13.5;limbs.forEach(l=>{const phase=l.s*(l.type==='leg'?1:-1);l.o.rotation.x=Math.sin(run)*.82*phase;l.o.rotation.z=l.type==='arm'?-.08*l.s:0});torso.position.y=2.05+Math.abs(Math.sin(run))*0.09;head.position.y=3.38+Math.abs(Math.sin(run))*0.045;head.rotation.z=Math.sin(run*.5)*.025;ears.forEach(e=>e.ear.rotation.x=-.08+Math.sin(run+e.s)*.14);tail.rotation.y=Math.sin(run*.5)*.28;rhexi.rotation.z+=(-dx*.075-rhexi.rotation.z)*.16;rhexi.rotation.y+=(-dx*.025-rhexi.rotation.y)*.15;if(jumping){rhexi.position.y+=vy;vy-=.0115;if(rhexi.position.y<=0){rhexi.position.y=0;jumping=false;vy=0}}if(sliding>0){sliding--;rhexi.scale.y+=(.62-rhexi.scale.y)*.25}else rhexi.scale.y+=(1-rhexi.scale.y)*.18;for(const o of objects){o.position.z+=speed;if(o.userData.collect)o.rotation.y+=.08;if(o.position.z>15){o.position.z-=205;o.visible=true;o.userData.hit=false}}collide();chase=Math.max(0,chase-.0015);cop.position.x+=(rhexi.position.x-cop.position.x)*.05;cop.position.z=7.5-chase*7}
// smooth chase camera; always behind Rhexi, looking forward down the road
camera.position.x+=(rhexi.position.x*.28-camera.position.x)*.08;camera.position.y+=(5.15+(jumping?.35:0)-camera.position.y)*.07;camera.position.z+=(10.8-camera.position.z)*.08;camera.lookAt(rhexi.position.x*.15,2.15,-9);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
