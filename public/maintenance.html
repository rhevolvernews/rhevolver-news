<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Rhevolver.news | Mantenimiento</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 15%, rgba(37, 99, 235, .20), transparent 32%),
        radial-gradient(circle at 85% 75%, rgba(217, 70, 239, .18), transparent 34%),
        #080a10;
      color: #fff;
    }
    .card {
      width: min(720px, 100%);
      padding: clamp(32px, 6vw, 64px);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      background: rgba(13, 16, 25, .88);
      box-shadow: 0 28px 80px rgba(0,0,0,.45);
      text-align: center;
      backdrop-filter: blur(18px);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 900;
      letter-spacing: -.04em;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #9333ea 55%, #db2777);
      box-shadow: 0 10px 30px rgba(147, 51, 234, .35);
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.02;
      letter-spacing: -.05em;
    }
    p {
      margin: 22px auto 0;
      max-width: 560px;
      color: #b9bfca;
      font-size: clamp(17px, 2.5vw, 21px);
      line-height: 1.6;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 30px;
      padding: 10px 15px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      color: #e5e7eb;
      font-size: 14px;
      font-weight: 700;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 16px rgba(245,158,11,.75);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark">R</span><span>Rhevolver.news</span></div>
    <h1>Estamos en mantenimiento</h1>
    <p>Rhevolver.news se encuentra temporalmente en mantenimiento mientras realizamos ajustes técnicos. Muy pronto estaremos de vuelta.</p>
    <div class="status"><span class="dot"></span> Servicio temporalmente limitado</div>
  </main>
</body>
</html>
